, "Venue and dates confirmed", "Trainer assigned", "Participants enrolled"], "ar": ["المواد معتمدة", "المكان والتواريخ مؤكدة", "المدرّب مخصص", "المشاركون مسجّلون"]}, "waste": {"en": ["Waiting for material approval", "Reprinting after a late content change", "Re-explaining the same point"], "ar": ["انتظار اعتماد المواد", "إعادة طباعة بعد تغيير متأخر", "إعادة شرح النقطة نفسها"]}, "cust": {"en": "the participant and their employer", "ar": "المشارك وجهة عمله"}}, {"k": "other", "en": "Other", "ar": "أخرى", "unit": {"en": "work item", "ar": "بند العمل"}, "stages": {"en": ["Intake", "Preparation", "Execution", "Handover"], "ar": ["الاستقبال", "التحضير", "التنفيذ", "التسليم"]}, "gate": {"en": ["Requirement confirmed", "Inputs complete", "Resource assigned", "Slot scheduled"], "ar": ["المتطلب مؤكد", "المدخلات مكتملة", "المورد مخصص", "الموعد مجدول"]}, "waste": {"en": ["Work waiting for an input", "Handling the same item twice", "Rework after an incomplete start"], "ar": ["عمل ينتظر مدخلاً", "مناولة البند نفسه مرتين", "إعادة عمل بعد بداية ناقصة"]}, "cust": {"en": "the next stage", "ar": "المرحلة التالية"}}];

const DAYS = {"1": {"en": "Day 1 — Lean foundations, mapping & work order readiness", "ar": "اليوم الأول — أسس اللين والرسم وجاهزية أوامر العمل"}, "2": {"en": "Day 2 — Waste elimination, 5S & the visual workplace", "ar": "اليوم الثاني — إزالة الهدر و5S وبيئة العمل البصرية"}, "3": {"en": "Day 3 — Flow, pull, readiness & takt", "ar": "اليوم الثالث — التدفق والسحب والجاهزية والتاكت"}, "4": {"en": "Day 4 — Quality at source, kaizen, leadership & capstone", "ar": "اليوم الرابع — الجودة من المصدر والكايزن والقيادة والتطبيق الختامي"}};

const MODULES = [{"code": "1.1", "day": 1, "en": "Why Lean in Naval Shipbuilding", "ar": "لماذا اللين في بناء السفن الحربية", "concept": {"en": "A traditional shipyard optimises each trade shop. Lean optimises the block's journey through all of them. Those two goals conflict, and the conflict is visible every time a finished block sits waiting.", "ar": "المنشأة التقليدية تحسّن كل قسم على حدة، واللين يحسّن رحلة العمل عبرها جميعاً. الهدفان يتعارضان، والتعارض ظاهر كلما وقف عمل منجز ينتظر الخطوة التالية."}, "why": {"en": "Most shipyards are organised by trade: a cutting shop, a welding shop, a paint hall, a pipe shop. Each one is measured on its own utilisation and its own output, which is a rational way to run a shop and a poor way to move a block. Work is batched to suit the shop, and blocks queue between shops.", "ar": "الأقسام التي تُقاس باستخدامها الذاتي تبدو مشغولة دائماً بينما العمل واقف. والسؤال الذي يغيّر السلوك ليس «هل فريقي مشغول؟» بل «هل العمل يتحرك؟»"}, "rules": {"en": ["Lean asks a different question. Instead of “is my shop busy?” it asks “is the block moving?” The block becomes the customer of every shop, each stage releases only what the next stage can absorb, and the queues between stages are designed rather than discovered.", "This does not mean the functional shop was wrong. It was a rational answer to a different question, in an era when the constraint was machine capacity rather than coordination. In a first-of-class naval programme the constraint has moved.", "Panel shop batches: cutting three blocks' worth of plate because the CNC setup is already loaded.", "Block queueing: a completed structural block waiting for a blast and paint slot it was never scheduled into.", "Trade-based measurement: a welding shop hitting its metres-of-weld target while the erection berth stands idle."], "ar": ["احكم على القسم بتحرّك العمل لا بانشغاله.", "لا تقبل تفسير تأخير يتوقف عند الخطوة الأخيرة؛ اسأل عن الحالة التي أنتجته في الأعلى.", "قِس الالتزام يومياً حيث يُنفَّذ العمل؛ المراجعة الشهرية تشريح للجثة."]}, "trap": {"en": "In your own area, when a block last sat idle — who was held responsible, and where did the condition that caused it actually originate?", "ar": "التعامل مع اللين كبرنامج إنتاجية موجّه للأفراد. كل هدر من الأهدار الثمانية خاصية في العملية لا في الجهد."}, "pg": 9}, {"code": "1.2", "day": 1, "en": "The 8 Wastes on the Yard Floor", "ar": "الأهدار الثمانية في ساحة العمل", "concept": {"en": "Waste is anything the customer would not pay for. In a shipyard the customer is the next stage, and the eight classic wastes each have a specific, recognisable shipyard form.", "ar": "الهدر كل ما لا يدفع مقابله مستقبِل العمل. ثمانية أشكال مرئية وقابلة للعدّ، وخلفها مشكلتان أعمق: عدم انتظام نمط الطلب، وإرهاق الأفراد أو المعدات."}, "why": {"en": "The eight wastes are the same as in any Lean text. What changes is what they look like in steel, coating and cable. Reading them in shipyard terms is the difference between a checklist and a diagnosis.", "ar": "معظم الهدر الذي يمكنك عدّه ظل لعدم الانتظام. سوِّ نمط الطلب وسيختفي قدر مدهش من العمل الإضافي والمخزون الزائد والفحص المتسرّع دون مهاجمته مباشرة."}, "rules": {"en": ["Behind the eight sit two more fundamental problems. Mura is unevenness — the erection sequence that demands four blocks in one week and none for the next three. Muri is overburden — one crane covering two erection sequences and a heavy outfitting lift. Most of the visible waste you can count is the shadow of one of these two.", "That is why the sequence matters: attack Mura first. Level the erection sequence and a surprising amount of the overtime, excess WIP and rushed inspection disappears without being attacked directly.", "Overproduction: prefabricating panels ahead of the erection sequence, creating unplanned WIP blocks.", "Waiting: cranes queued for lifts; blocks idle awaiting classification-society sign-off.", "Transport: repeated block moves between fabrication bay, blast and paint hall, and erection berth."], "ar": ["سجّل الهدر الذي تستطيع إثباته فقط؛ الهدر المتخيَّل لا يُسجَّل.", "اكتب لكل هدر مُطلِقه — ما سببه لا شكله.", "رتّب حسب الساعات الضائعة شهرياً لا حسب مدى إزعاج الهدر.", "اسأل عن كل هدر مرئي: هل ينتجه عدم انتظام في الأعلى؟"]}, "trap": {"en": "Which of the eight is largest in your own area — and which is largest that nobody ever writes down?", "ar": "تسجيل الهدر كـ«الناس لا تعمل بجد». هذا ليس من الثمانية، وهو يوقف التحليل عند الشخص بدل العملية التي أنتجت الحالة."}, "pg": 12}, {"code": "1.3", "day": 1, "en": "Value Stream Mapping + Work Order Readiness", "ar": "رسم سلسلة القيمة وجاهزية أوامر العمل", "concept": {"en": "A Value Stream Map is the only tool that puts material flow and information flow on one page. That is exactly why the Work Order Readiness gate belongs inside it: readiness is an information problem that shows up as a material problem.", "ar": "خريطة سلسلة القيمة هي الأداة الوحيدة التي تضع تدفق المواد وتدفق المعلومات والخط الزمني على صفحة واحدة. ولهذا تنتمي بوابة الجاهزية إليها — فالجاهزية مشكلة معلومات تظهر كمشكلة تسليم."}, "why": {"en": "Nobody in a shipyard sees the whole block journey. The panel shop sees four days of it; the erection berth sees two. A Value Stream Map is usually the first time the room shares one picture of the same block.", "ar": "معظم الخرائط تُظهر ما يحدث بعد بدء العمل، وأكبر الخسائر تتقرر قبل بدئه. ينبغي ألا يدخل العمل التدفق إلا بعد أن تؤكد الوظائف المالكة لمتطلباته توفرها فعلاً. وتاريخ البدء المخطط ليس متطلباً."}, "rules": {"en": ["Every map in this course has three lanes. The information-flow lane at the top answers the question “who tells the bay to start?” — schedule, work order, readiness review, drawing release, kit call-off, hold-point booking. The material-flow lane in the middle runs plate to panel to block to erected block. The timeline at the bottom separates process time from waiting time.", "The current state is a diagnosis, not the deliverable. The deliverable is a future state with three ranked improvements, each with a named owner and a date.", "WORK ORDER READINESS. Most shipyard maps show what happens after work starts. The largest losses are decided before it starts. A work order is READY only when Production Engineering, Production Planning and Procurement / Logistics have jointly confirmed that the prerequisites for execution are genuinely available. A planned start date is not a prerequisite. Work enters the production flow only after readiness has been verified — NO READY, NO START.", "The gate is drawn in the information-flow lane, upstream of the first fabrication stage it controls. Four fields are then added to every data box on the map: work order readiness percentage, drawing revision churn after release, kit completeness at the staging point, and readiness lead time.", "Information flow: programme schedule → work order raised → work order readiness review → Production Engineering + Production Planning + Procurement/Logistics verification → READY / NOT READY → release to production → material and production flow."], "ar": ["ارسم المسارات الثلاثة قبل أي تفصيل: المعلومات، والمواد، والخط الزمني.", "ضع صندوق بيانات تحت كل مرحلة؛ المرحلة بلا صندوق زينة.", "افصل زمن المعالجة عن زمن الانتظار واجمع كلاً على حدة.", "ارسم بوابة الجاهزية في مسار المعلومات أعلى أول مرحلة تتحكم بها.", "العمل غير الجاهز يُعاد ترتيبه لا يُطلق. لا جاهزية فلا بدء."]}, "trap": {"en": "Day 1 established where the time goes. Day 2 makes it visible. You cannot flow through a workplace you cannot see, and you cannot manage a block status you have to telephone somebody to find out.", "ar": "اعتبار اجتماع تخطيط أسبوعي قائم بوابة جاهزية. بدون نجاح أو رسوب موثّق لكل عنصر، وبدون إعادة ترتيب عند الرسوب، هو اجتماع حالة لا أكثر."}, "pg": 15}, {"code": "2.1", "day": 2, "en": "5S for Shipyard Areas", "ar": "نظام 5S لمناطق الترسانة", "concept": {"en": "The five pillars are generic. Where they bite in a shipyard is not — and in almost every case the failure mode is loss of traceability or findability, not untidiness.", "ar": "خمس خطوات متتابعة: الفرز، والترتيب، والتنظيف، والتقييس، والاستدامة. الأربع الأولى حدث، والخامسة نظام إداري — وهي وحدها التي تفشل عادةً."}, "why": {"en": "Sort, Set in order, Shine, Standardise and Sustain are familiar to most people in a shipyard, usually under the heading of housekeeping. That framing is the reason 5S programmes fail here.", "ar": "بيئة العمل المرتبة ليست هدفاً جمالياً؛ هي شرط لرؤية الحالة غير الطبيعية. في مكان فوضوي لا يمكن تمييز الشاذ عن المعتاد، فتضيع كل الإشارات."}, "rules": {"en": ["In a steel stockyard, a 5S failure is lost traceability by heat number and grade. In a blast and paint booth it is a coating applied outside its cycle window. In outfitting staging it is a complete kit that nobody can find. None of those is untidiness, and none of them is fixed by a clean-up campaign.", "The link back to Day 1 is direct. Staging labelled by block identifier and erection zone is what allows Procurement / Logistics to declare a kit ready. Without it, the readiness gate depends on somebody walking the laydown area with a clipboard — which is why it fails by week three.", "Steel stockyard: plate and profile marking, FIFO lanes by heat number and grade.", "Panel and fabrication shop: marked-out laydown zones per block, shadowed jig and fixture storage.", "Blast and paint booth: colour-zoned staging by primer and coating type, ventilation and PPE points marked."], "ar": ["افرز بمعيار الاستخدام لا بمعيار القيمة؛ «قد نحتاجه» ليس سبباً للاحتفاظ.", "رتّب بحيث يوجَد كل شيء في أقل من دقيقتين.", "اجعل التنظيف فحصاً؛ من ينظّف المعدة يكتشف تسرّبها.", "الاستدامة تعني تدقيقاً مجدولاً بمالك مسمّى، لا حملة سنوية."]}, "trap": {"en": "How long would it take, right now, for a fitter new to your bay to find the correct spool for a named block and zone?", "ar": "تنفيذ الخطوات الأربع الأولى ثم إعلان النجاح. بلا تدقيق مجدول تعود المنطقة لحالتها خلال ستة أسابيع."}, "pg": 20}, {"code": "2.2", "day": 2, "en": "Visual Management & Andon", "ar": "الإدارة البصرية وأندون", "concept": {"en": "A board is not a report. It exists so that a person standing in front of it changes what they do next. If it fails that test, it is wall decoration.", "ar": "الإدارة البصرية تجعل الحالة مرئية دون سؤال أحد. وأندون آليةٌ تُظهر الحالة غير الطبيعية فور حدوثها وتستدعي استجابة مسمّاة خلال زمن محدد."}, "why": {"en": "The single test for any field on any board is whether it changes a decision within the same shift. Applied honestly, that test removes most of what usually appears on a production board.", "ar": "اللوحة التي ترفع تقريراً للأعلى ليست إدارة بصرية؛ اللوحة التي تغيّر ما يفعله الناس في الوردية نفسها هي كذلك."}, "rules": {"en": ["Four boards earn their place in a shipyard. A block-status board shows fabrication, paint, erection, outfitting and testing status by block identifier. A dock, berth and crane occupancy board exposes lift conflicts days before they bite. A readiness board shows every work order in the next three weeks by function status. A hold-point tracker shows class inspections booked, attended, cleared or awaiting re-inspection.", "Andon is the escalation half of visual management. The hard part is not the trigger — it is the response. Every trigger needs a named responder and a maximum response time, or the cord is pulled twice and then never again.", "Block-status board covering a six-block production line, updated by the bay, read by planning.", "Crane and dock occupancy board showing booked lifts against available windows.", "Readiness board showing the three-week rolling window in green, amber and red by function."], "ar": ["اختبر كل حقل بسؤال: هل يغيّر قراراً خلال هذه الوردية؟ واحذف الباقي.", "لكل إشارة أندون مستجيب مسمّى وزمن استجابة أقصى.", "من ينفّذ العمل هو من يحدّث اللوحة، لا تقرير مجمّع.", "اختبر الإشارة فعلياً: أطلقها وقِس هل جاء أحد."]}, "trap": {"en": "What happens in your yard today when someone raises a hold and nobody comes?", "ar": "لوحة مزدحمة بعشرين مؤشراً لا يغيّر أي منها قراراً اليوم. الازدحام يخفي الإشارة."}, "pg": 23}, {"code": "2.3", "day": 2, "en": "Standard Work for Repetitive Shipyard Tasks", "ar": "العمل القياسي للمهام المتكررة", "concept": {"en": "The ship is different every time. The weld sequence is not. Standard work applies to the repetitive majority of the shift, not to the first-of-class minority.", "ar": "العمل القياسي هو أفضل تسلسل معروف حالياً لمهمة متكررة، مكتوب مع من ينفّذها، وبزمن قياسي لكل خطوة."}, "why": {"en": "The predictable objection to standard work in a shipyard is that every ship is different. It is worth testing that claim: asked what proportion of a normal shift is genuinely first-of-class work, most supervisors answer under twenty per cent. The remaining eighty per cent is the standard-work opportunity.", "ar": "بلا معيار لا يوجد خط أساس، وبلا خط أساس لا يوجد تحسين — فقط تغيير. المعيار ليس قيداً على المهارة بل نقطة انطلاق للتحسين."}, "rules": {"en": ["A job breakdown sheet has three columns: major steps, key points, and reasons — written in the operator's own words rather than the supervisor's. Safety checkpoints belong in it as numbered steps. A hot-work permit written in the margin gets treated like a margin note.", "Attaching a standard time to every step is what makes takt calculation and line balancing possible on Day 3. Without times, the balancing exercise has no inputs.", "Panel fit-up sequence: tack pattern, root-gap tolerance, and the check before the first pass.", "Weld sequencing to control distortion, using the qualified procedure (WPS) for SMAW, FCAW or SAW. Distortion is the largest single driver of downstream fit-up rework.", "Pipe-spool fabrication: cut, bevel, fit, weld, test — with the spool template and test pack raised together."], "ar": ["اكتب المعيار مع المشغّل لا نيابة عنه.", "سجّل زمناً قياسياً لكل خطوة ليتحرك التحسين عن رقم.", "المعيار الذي نجا من ثلاثة عيوب متطابقة هو نفسه المشكلة.", "قنّن المتكرر فقط؛ العمل الفريد فعلاً لا يُقنّن."]}, "trap": {"en": "Day 3 sets the rate, controls the release and cuts the changeover. It is the densest day of the course and the one that most directly changes how work reaches your bay.", "ar": "كتابة المعيار في مكتب ثم تسليمه للورشة. لن يُتبع، وسيُلام المشغّل."}, "pg": 26}, {"code": "3.1", "day": 3, "en": "Takt Time & Line Balancing", "ar": "زمن التاكت وموازنة الخط", "concept": {"en": "Takt is not a target you set. It is a rate the programme has already decided. Your only choice is whether to design to it or discover it late.", "ar": "التاكت هو الزمن المتاح مقسوماً على الطلب. وهو ليس سرعة العمل بل إيقاع الطلب، ويُشتق من معلم البرنامج لا من رأي الورشة."}, "why": {"en": "Takt time is available production time divided by the number of blocks required in that time. In a naval programme the numerator and denominator both come from the milestone plan — keel-lay, erection complete, launch, HAT, SAT — not from a shop's own view of its capacity.", "ar": "بلا تاكت لا تعرف هل محطتك متأخرة أم متقدمة. وموازنة الخط توزّع محتوى العمل بحيث تقترب كل محطة من التاكت دون تجاوزه."}, "rules": {"en": ["Once takt is known, every station on the line can be measured against it. A station running above takt is not merely slow; it is the programme. A station well below takt is spare capacity that can absorb work content from the constraint.", "Line balancing is the act of moving work content between stations until every one sits under takt. It is usually resisted, because moving content moves work between trades.", "Takt derived from the erection-complete milestone and the number of blocks remaining.", "Panel-line stations measured against takt: marking, cutting, forming, sub-assembly, fit-up.", "The constraint in a block line is frequently not a machine but a shared resource — the heavy crane, the paint hall slot, or the class surveyor's availability."], "ar": ["اشتق التاكت من الطلب لا من الطاقة.", "أي محطة تتجاوز التاكت هي عنق زجاجة بالتعريف.", "انقل محتوى العمل لا الأفراد.", "أعد حساب التاكت كلما تغيّر الطلب أو الزمن المتاح."]}, "trap": {"en": "What is the takt time implied by your own current milestone plan — and does anyone in your bay know it?", "ar": "الخلط بين زمن الدورة والتاكت. الأول ما تفعله، والثاني ما يتطلبه الطلب."}, "pg": 30}, {"code": "3.2", "day": 3, "en": "Pull Systems, Kanban + Work Order Readiness", "ar": "أنظمة السحب وكانبان وجاهزية العمل", "concept": {"en": "Kanban gives the signal. Work Order Readiness supplies the work. A pull signal is worthless if there is nothing ready to pull — without both, pull simply becomes a queue of stopped jobs.", "ar": "نظام الدفع يُطلق العمل حسب الجدول، ونظام السحب يُطلقه حين تشير المرحلة التالية بجاهزيتها. وكانبان هي الإشارة التي تحمل ذلك الطلب."}, "why": {"en": "Push releases work because a date arrived. Pull releases work because the stage that will consume it has signalled that it is ready to consume. In material terms the difference is visible in the staging area: under push, kits are staged early to be safe, then re-handled, damaged or lost.", "ar": "السحب بلا بوابة جاهزية ينقل الفوضى فقط. الإشارة تخبرك متى، والبوابة تخبرك هل يجوز أصلاً."}, "rules": {"en": ["Kanban does not fit everything in a shipyard. Two-bin logic works for locally fabricated steelwork, standard fittings, consumables, welding wire and fasteners — short lead time and repeatable demand. Long-lead imported equipment routed through the international partner needs expediting and buffer logic managed by need-date, not by reorder point. Running both on the same logic is a common and expensive error.", "WORK ORDER READINESS, SECOND INTEGRATION. On Day 1 readiness appeared as an information-flow gate on the map. Here it appears as a release rule. The bay does not pull the next scheduled work order; it pulls the next READY work order. The rule is NO READY — NO START.", "The ready backlog, sometimes called the ready bank, is a supermarket of work orders rather than of material. It is sized at one to two takt periods per bay. Below one takt period the bay starves the moment a green work order turns red. Above two, you generate re-planning waste and drawing churn against work that has not started.", "Work orders are held in a three-week rolling window and move left to right only when a function signs them off: N–3 forecast, N–2 commit, N–1 freeze, then READY. Anything still red at N–1 is re-sequenced out and re-forecast.", "Kanban for outfitting kits: pipe spools, cable reels and fittings staged just-in-sequence to the correct block and erection zone."], "ar": ["لكل حلقة كانبان نقطة إطلاق وكمية وزمن تزويد محسوبة لا مقدّرة.", "لا تسحب عملاً غير جاهز؛ الإشارة لا تلغي البوابة.", "ابدأ بحلقة واحدة وأتقنها قبل التوسع.", "البطاقة تعود مع المادة دائماً، وإلا انكسرت الحلقة."]}, "trap": {"en": "How wide is the frozen window in your own area today, who is allowed to break it, and how often is it broken?", "ar": "تركيب كانبان فوق عملية غير مستقرة. الحلقة ستتعطل وسيُلام النظام لا التقلّب."}, "pg": 33}, {"code": "3.3", "day": 3, "en": "SMED — Changeover and Setup Reduction", "ar": "تقليل زمن التحويل SMED", "concept": {"en": "Internal setup can only happen while the machine or the dock is stopped. External setup can be prepared in advance. Most changeover time in a shipyard is external work being performed internally.", "ar": "فصل العمل الداخلي الذي يتطلب توقف المعدة عن العمل الخارجي الذي يمكن إنجازه أثناء تشغيلها، ثم تحويل أكبر قدر من الداخلي إلى خارجي."}, "why": {"en": "SMED — Single-Minute Exchange of Die — comes from press-shop work, and the name does not travel well to a dry dock. The method does. Every element of a changeover is classified as internal or external, then as much internal work as possible is converted to external.", "ar": "زمن التحويل الطويل يفرض دفعات كبيرة، والدفعات الكبيرة تفرض مخزوناً وزمناً كلياً أطول. تقصير التحويل يفتح الباب لكل ما يليه."}, "rules": {"en": ["In a shipyard the highest-value application is dock or slipway preparation between block erections. Every hour the dock is stopped is programme time, not shop time. The same method applies to panel-line jig changeovers between block types and to crane and rigging reconfiguration for different block weights.", "The mechanics are simple; the discipline is in the classification. The question to force on every element is whether it could have been done while the previous block was still in the dock. Most conversion opportunities turn out to be staging and pre-checking activities that nobody has been asked to move.", "Dock and slipway preparation: staging, cribbing, shimming and alignment between erections.", "Panel-line jig and fixture changeover between block types.", "Crane and lift reconfiguration — rigging changes for different block weights."], "ar": ["صوّر التحويل كاملاً قبل تحليله؛ الذاكرة تخطئ.", "صنّف كل خطوة داخلية أو خارجية قبل محاولة تسريع أي منها.", "حوّل قبل أن تسرّع؛ التحويل أرخص من التسريع.", "استهدف تقليصاً بالنصف كبداية لا بالنسب الصغيرة."]}, "trap": {"en": "Days 1 to 3 gave you tools. Day 4 gives you the management system that keeps them alive, and the simulation that proves to you what they are worth.", "ar": "شراء معدة أسرع قبل تحليل التحويل. غالباً نصف الزمن خارجي أصلاً ولا يحتاج إنفاقاً."}, "pg": 37}, {"code": "4.1", "day": 4, "en": "Poka-Yoke & Quality at Source", "ar": "منع الخطأ والجودة من المصدر", "concept": {"en": "Quality at source means the error cannot be made — not that it is caught sooner. Detection is a fallback, not a poka-yoke.", "ar": "بوكا يوكه وسيلة تجعل الخطأ مستحيلاً أو تكشفه فور وقوعه، بدل الاعتماد على انتباه الإنسان."}, "why": {"en": "A poka-yoke is a device or arrangement that makes the wrong action impossible, or makes it immediately and unmistakably obvious. The test to apply to any proposal is simple: does it prevent, does it detect, or does it only record? Only the first is a true poka-yoke.", "ar": "الفحص يكتشف العيب بعد صنعه، والمنع يوقفه قبل وقوعه. وكلما تأخر الاكتشاف ارتفعت الكلفة أضعافاً."}, "rules": {"en": ["Error-proofing is a design choice made before work starts, which places it inside the readiness gate rather than downstream of it. A fit-up gauge that only seats at a correct root gap is useless if it is not in the kit.", "The business case is the cost of the same defect caught at different points. Caught before erection it costs one unit of effort; caught after painting and outfitting it costs several times that, because access has been closed; caught at HAT or SAT it costs an order of magnitude more, because the compartment is complete and the programme is on the critical path. These multipliers are illustrative — substitute your own.", "Welding: fit-up gauges that only seat at a correct root gap; WPS-controlled sequencing; weld maps that make a skipped joint visible at a glance.", "Pipe fit-up: spool templates that will not seat if the spool is wrong; flange bolt patterns that cannot be assembled off-orientation.", "Cable termination: colour-coded and labelled cores terminated to a printed schedule rather than a drawing read at the panel."], "ar": ["امنع أولاً، ثم اكشف، ثم سجّل — بهذا الترتيب.", "الجهاز الأرخص الذي يمنع أفضل من الأغلى الذي يكشف.", "صمّمه مع المشغّل ليبقى مستخدَماً.", "اختبره بمحاولة ارتكاب الخطأ عمداً."]}, "trap": {"en": "Which recurring defect in your area could be made physically impossible — and what would that device cost?", "ar": "إضافة خطوة فحص وتسميتها منع خطأ. الفحص ليس منعاً."}, "pg": 41}, {"code": "4.2", "day": 4, "en": "Structured Kaizen Events", "ar": "فعاليات الكايزن المنظّمة", "concept": {"en": "Root cause is reached by evidence, not by consensus. Consensus produces the most popular cause, not the real one.", "ar": "الكايزن المنظّم فعالية محددة النطاق والزمن، بفريق متعدد الوظائف، تنتهي بتغيير مطبَّق لا بتوصية."}, "why": {"en": "A Kaizen event is a short, focused improvement effort on one recurring problem, run by the people who do the work. It is not a project and it is not a committee. The output is a single page.", "ar": "التحسين الذي ينتهي بتقرير لا يغيّر شيئاً. الفعالية التي لا تُنفِّذ تغييراً قبل انتهائها لم تكن كايزن."}, "rules": {"en": ["Two tools get you to root cause. Five whys follows a single causal chain, and every why must be written down — the chain is the evidence, not just the final answer. Cause-and-effect analysis, drawn as a fishbone, opens the search across six categories when the chain is not obvious.", "The A3 format holds the whole event on one page: background, current state with data, root cause, countermeasure, owner and date, and confirmed effect. The discipline is the point; the format is the container.", "In review, challenge the root cause rather than the countermeasure. That is the harder critique and the one most reviews skip.", "Problems worth a Kaizen event in a shipyard: late outfitting kits reaching the berth; blocks queueing behind a crane or a hold point; repeat NDT rejections on one specific joint type; work orders repeatedly released red on the same readiness element.", "Fishbone categories adapted for a shipyard: Man, Machine, Material, Method, Measurement, Environment."], "ar": ["حدّد النطاق ضيقاً؛ النطاق الواسع ينتج توصيات لا تغييرات.", "اجمع البيانات قبل الفعالية لا أثناءها.", "طبّق تغييراً واحداً على الأقل قبل انتهاء الأسبوع.", "حدّد مالكاً وتاريخاً لكل بند متبقٍ."]}, "trap": {"en": "Which recurring problem in your area has been explained the same way for a year without being fixed — and has anyone ever written the whys down?", "ar": "فعالية تنتهي بقائمة إجراءات بلا مُلّاك. ستتبخر خلال شهر."}, "pg": 44}, {"code": "4.3", "day": 4, "en": "Daily Management, KPIs & Lean Leadership", "ar": "الإدارة اليومية والمؤشرات والقيادة الرشيقة", "concept": {"en": "Tools do not sustain themselves. A management system sustains them — three tiers, one hour a day in total, every day.", "ar": "الإدارة اليومية إيقاع قصير ومنظّم ترتفع فيه المشاكل وتُسنَد لمالك ووقت في اليوم نفسه، عبر مستويات متدرجة."}, "why": {"en": "A tiered daily management system connects the bay to the programme through short standing meetings. Tier 1 runs at the bay for fifteen minutes before shift: safety, yesterday's output against takt, today's readiness reds, andons open. Tier 2 runs at shipyard level for twenty minutes: cross-bay conflicts, crane and dock contention, escalated readiness reds, NCR trend. Tier 3 runs weekly at programme level: milestone adherence, long-lead exposure, partner interface issues, ICV progress.", "ar": "بلا إيقاع يومي تُدار المشاكل بالحملات. والقيادة الرشيقة تُقاس بجودة أسئلة القائد عند اللوحة لا بجودة إجاباته."}, "rules": {"en": ["The rule that makes Tier 1 work is that only reds are discussed. Greens are not reviewed. A tier meeting that walks every item becomes a status report and dies.", "The KPI tree connects what the bay can influence to what the programme reports. Work Order Readiness percentage belongs in the schedule branch, because it is a leading indicator of milestone adherence — it moves weeks before the milestone does.", "Working with an international shipbuilding partner, the guidance is to align to the partner's QA/QC standards rather than running a parallel system, to agree hold-point procedures and reporting formats once and in writing, and to report Lean gains in the partner's own metric language.", "Tier 1 at the bay: fifteen minutes, standing, at the block-status and readiness boards.", "Tier 2 at shipyard level: crane and dock contention, escalated readiness reds."], "ar": ["كل مستوى له نطاق وزمن ومحفّز تصعيد محدد.", "ناقش الاستثناءات فقط؛ الأخضر لا يُناقش.", "المؤشر الذي لا يغيّر قراراً يُحذف.", "اسأل ولا تجب؛ السؤال هو التدخل."]}, "trap": {"en": "Which measure currently reported from your area could nobody in the bay actually influence?", "ar": "اجتماع يومي يستعرض كل شيء. سيمتد لساعة وسيموت خلال شهر."}, "pg": 47}, {"code": "4.4", "day": 4, "en": "Capstone — Lean Shipyard Simulation", "ar": "التطبيق الختامي — محاكاة الترسانة الرشيقة", "concept": {"en": "The same block, built twice. Round 1 under the conditions most yards run today; Round 2 with the four days applied. The comparison is the argument.", "ar": "محاكاة كاملة تُدار جولتان: الأولى بالوضع الحالي، والثانية بعد تطبيق أدوات الأيام الأربعة، مع قياس الفرق بالأرقام."}, "why": {"en": "Round 1 runs under traditional push conditions. Work is released on the clock regardless of readiness. Drawings and kits are handed over incomplete. There is no board, no WIP cap and no readiness check. A quality issue and a changeover delay are injected part way through.", "ar": "الفرق بين الجولتين هو الدليل الوحيد الذي يقنع الإدارة. والرقم الذي تقيسه بنفسك يقنعك أنت أيضاً."}, "rules": {"en": ["Between rounds the team plans for ten minutes and chooses which tools to apply. A readiness gate is mandatory — without it the comparison is not a fair test of the course.", "Round 2 runs the same build. Work is released only when the team's own gate passes it.", "Both rounds are scored on the same five measures. In most runs Round 2 starts slower, because the gate holds work back at the beginning. The time is recovered before the halfway point, and the debrief should show exactly where.", "Roles at each table: bay supervisor, planner, production engineer, procurement / logistics, quality, observer.", "The observer records time, WIP and safety observations rather than participating in the build."], "ar": ["سجّل مقاييس الجولة الأولى قبل أي تغيير.", "غيّر شيئاً واحداً في كل مرة لتعرف ما الذي أحدث الأثر.", "لكل تغيير مالك وتاريخ قبل نهاية اليوم.", "احمل ثلاثة إجراءات فقط إلى مكان عملك؛ الثلاثون تفشل."]}, "trap": {"en": "Three actions, on your own line, within thirty days. A verb, a place, a name and a date. “Improve communication” and “the team” are not acceptable entries.", "ar": "محاكاة بلا قياس. بلا أرقام تصبح لعبة ممتعة بلا أثر."}, "pg": 50}];

const ACTS = [{"n": 1, "day": 1, "en": "Pre-Course Knowledge Check", "ar": "الفحص المعرفي القبلي", "time": "15 min", "team": {"en": "Individual", "ar": "فردي"}, "mod": "Opening", "out": {"en": "Completed check, kept by you", "ar": ""}, "purpose": {"en": "Establish where you are starting from, so you can see your own movement by Day 4. Nothing is collected and nothing is graded.", "ar": "حدّد نقطة انطلاقك لترى تقدّمك بنفسك بحلول اليوم الرابع. لا شيء هنا يُصحَّح ولا يُجمع."}, "scenario": {"en": [], "ar": []}, "instr": {"en": ["Answer all fifteen questions individually, in this workbook.", "Where you are unsure, mark your best answer rather than leaving it blank.", "Do not discuss answers with your table until the trainer says so.", "The answer key is at the back of this workbook. Look at it tonight, not now.", "Workspace — complete this", "Reference: Participant Manual — Course Overview, How you are assessed"], "ar": ["أجب من واقع خبرتك الحالية لا مما تظنه الإجابة المتوقعة.", "لا تراجع أي مادة قبل الإجابة؛ الغرض قياس نقطة البداية.", "اترك ما لا تعرفه فارغاً بدل التخمين.", "سجّل البعدين الأضعف لديك بعد انتهائك.", "احتفظ بالورقة؛ ستجيب عن الأسئلة نفسها في اليوم الرابع.", "قارن النسختين بنفسك في نهاية البرنامج."]}, "quest": {"en": [], "ar": []}, "dec": {"en": [], "ar": []}, "data": null, "pg": 8, "tmpl": [], "model": {"en": "Weakest two dimensions: work readiness (1.8) and flow (2.1). Readiness is weakest because no single function owns the release decision for {u} — {g0} is confirmed verbally and never recorded. Flow is weakest because we measure each stage's utilisation and nobody measures how long a {u} takes to reach {c}.", "ar": "أضعف بعدين: جاهزية العمل (1.8) والتدفق (2.1). الجاهزية أضعف لأن لا وظيفة واحدة تملك قرار إطلاق {u} — و{g0} يُؤكَّد شفهياً ولا يُسجَّل. والتدفق أضعف لأننا نقيس استخدام كل مرحلة ولا أحد يقيس كم يستغرق {u} حتى يصل إلى {c}."}}, {"n": 2, "day": 1, "en": "Lean Expectations", "ar": "توقعات اللين", "time": "15 min", "team": {"en": "Tables of 4–5", "ar": "طاولات من 4–5"}, "mod": "1.1", "out": {"en": "One flipchart per table", "ar": ""}, "purpose": {"en": "Surface what actually slows your work down, and discover that most of it is information rather than material.", "ar": "أظهر ما يبطئ عملك فعلاً، واكتشف أن معظمه معلومات لا مواد."}, "scenario": {"en": ["Your table has been asked by the programme manager to name the single thing that most slows work in your own areas. You have fifteen minutes before he arrives."], "ar": []}, "instr": {"en": ["Each person writes one thing that slows their own work down most.", "As a table, group them into three buckets: a material problem, an information problem, or a sequencing problem.", "Count each bucket and write the counts on the flipchart.", "Name the one your table would fix first if it could, and say why.", "Workspace — complete this"], "ar": ["يكتب كل شخص شيئاً واحداً يبطئ عمله أكثر من غيره.", "ابدأ من عملك الحقيقي لا من بيانات الحالة الدراسية.", "صنّفوا البطاقات إلى مواد أو معلومات أو تسلسل.", "عُدّوا كل فئة واكتبوا العدد على اللوحة.", "اختاروا المشكلة الواحدة التي ستهاجمونها أولاً."]}, "quest": {"en": ["Which bucket was largest at your table?", "Did anyone write “people not working hard enough”? If not, why not?"], "ar": ["أي فئة كانت الأكبر، وهل فاجأكم ذلك؟", "هل كتب أحد «الناس لا تعمل بجد»؟ أي فئة تنتمي إليها؟"]}, "dec": {"en": ["The one thing our table would fix first, and why:", "Reference: Participant Manual — Module 1.1"], "ar": ["المشكلة الواحدة التي سنهاجمها أولاً، والسبب:"]}, "data": null, "pg": 9, "tmpl": [], "model": {"en": "Counts — information 7, sequencing 4, material 2. The one we would attack first is “{pain}”, because it appears in three different functions' cards and it is an information failure that arrives looking like a material failure. Nobody wrote “people not working hard enough”, but two cards blamed the stage that suffers the delay rather than the stage that causes it.", "ar": "الأعداد — معلومات 7، وتسلسل 4، ومواد 2. والمشكلة التي سنهاجمها أولاً «{pain}»، لأنها ظهرت في بطاقات ثلاث وظائف مختلفة، ولأنها فشل معلوماتي يصل بمظهر فشل مادي. لم يكتب أحد «الناس لا تعمل بجد»، لكن بطاقتين لامتا المرحلة التي تعاني التأخير لا المرحلة التي تسببه."}}, {"n": 3, "day": 1, "en": "Waste Walk", "ar": "جولة الهدر", "time": "45 min", "team": {"en": "Tables of 4–5", "ar": "طاولات من 4–5"}, "mod": "1.2", "out": {"en": "Tagged map, Templates T1 and T2 completed", "ar": ""}, "purpose": {"en": "Identify the eight wastes using evidence from a real production flow, and record the trigger behind each one rather than its appearance.", "ar": "حدّد الأهدار الثمانية بدليل من تدفق إنتاجي حقيقي، وسجّل المُطلِق خلف كل منها بدل شكله الظاهر."}, "scenario": {"en": ["You are walking the CORVETTE ALPHA floor flow from panel shop to HAT and SAT. Your table has the A2 floor-flow map and eight colours of sticker, one colour per waste."], "ar": []}, "instr": {"en": ["Tag only wastes you can evidence from your own experience. An imagined waste gets no sticker.", "On each sticker write the trigger in three words — what caused it, not what it looks like.", "Transfer every sticker to Template T1 and T2 in Part 2.", "Rank your top three by hours lost per month.", "Post the map for the gallery walk and read two other tables' maps."], "ar": ["سجّل الهدر الذي تستطيع إثباته من خبرتك فقط؛ الهدر المتخيَّل لا يُسجَّل.", "اكتب على كل بطاقة المُطلِق بثلاث كلمات — ما سببه لا شكله.", "انقل كل بطاقة إلى القالبين T1 وT2 في الجزء الثاني.", "رتّب أعلى ثلاثة حسب الساعات الضائعة شهرياً.", "علّق الخريطة لجولة المعرض واقرأ خريطتي طاولتين أخريين."]}, "quest": {"en": ["Which waste did every table find? That one is systemic, not local.", "Which of your tags are Mura wearing a Muda costume?", "How many of your tags trace back to something that was missing when the work started?"], "ar": ["أي هدر وجدته كل الطاولات؟ ذاك نظامي لا موضعي.", "أي بنودك مورا يرتدي زيّ مودا؟", "كم من بنودك يعود إلى شيء كان ناقصاً عند بدء العمل؟"]}, "dec": {"en": ["Our top three wastes, ranked by hours lost per month:", "Reference: Participant Manual — Module 1.2"], "ar": ["أعلى ثلاثة أهدار لدينا مرتّبة بالساعات الضائعة شهرياً:"]}, "data": {"hdr": ["Panel shop", "Sub-assembly", "Block assembly", "Blast / paint", "Erection berth", "On-board outfit", "HAT / SAT"], "rows": []}, "pg": 11, "tmpl": ["T1", "T2"], "model": {"en": "Top three by hours lost per month: (1) {w0} — 42 h, trigger “{g0} late”, owned by the function that issues it. (2) {w1} — 26 h, trigger “no staging area”. (3) {w2} — 18 h, trigger “started without kit”. Every table found waiting, so waiting is systemic not local. Six of our eleven tags trace back to something missing when the work started.", "ar": "أعلى ثلاثة بالساعات الضائعة شهرياً: (1) {w0} — 42 ساعة، والمُطلِق «{g0} متأخر»، وتملكه الجهة المُصدِرة. (2) {w1} — 26 ساعة، والمُطلِق «لا توجد منطقة تجهيز». (3) {w2} — 18 ساعة، والمُطلِق «بدأ بلا كِت». وكل الطاولات وجدت الانتظار، فهو نظامي لا موضعي. وستة من بنودنا الأحد عشر تعود إلى شيء كان ناقصاً عند بدء العمل."}}, {"n": 4, "day": 1, "en": "8 Wastes Classification", "ar": "تصنيف الأهدار الثمانية", "time": "15 min", "team": {"en": "Tables of 4–5", "ar": "طاولات من 4–5"}, "mod": "1.2", "out": {"en": "Template T2 completed and sorted", "ar": ""}, "purpose": {"en": "Convert your Waste Walk tags into a prioritised list with an owning function and a priority index.", "ar": "حوّل الملاحظات إلى قائمة مرتّبة بوظيفة مالكة ومؤشر أولوية قابل للدفاع عنه."}, "scenario": {"en": [], "ar": []}, "instr": {"en": ["Transfer each sticker onto Template T2 in Part 2.", "Add the owning function — the function that owns the cause, not the one that suffers it.", "Score frequency 1–5 and impact 1–5, then multiply for a priority index.", "Sort by priority index and mark your top three."], "ar": ["انقل كل بند من جولة الهدر إلى القالب T2.", "أضف الوظيفة التي تملك السبب لا التي تعاني منه.", "قيّم التكرار من 1 إلى 5 والأثر من 1 إلى 5.", "اضرب الاثنين للحصول على مؤشر الأولوية ورتّب تنازلياً.", "حدّد أعلى ثلاثة بلون مختلف."]}, "quest": {"en": ["Did any waste appear under two headings? Choose one and delete the other.", "Which function appears most often as the owner of the cause?", "Reference: Participant Manual — Module 1.2, Practical rules"], "ar": ["هل ظهر هدر واحد تحت عنوانين مختلفين؟", "أي وظيفة تظهر أكثر كمالك للسبب لا كمالك للألم؟"]}, "dec": {"en": [], "ar": ["الوظيفة التي تملك أكبر عدد من أسبابنا الثلاثة الأولى:"]}, "data": null, "pg": 13, "tmpl": ["T2"], "model": {"en": "The function owning most of our top three causes is the one that releases {g0} — it owns two of the three, though it suffers neither. Two wastes appeared under two headings: the same delay was tagged as waiting at {s1} and as inventory at {s2}. We kept it as waiting, because inventory there is the symptom.", "ar": "الوظيفة المالكة لأكثر أسبابنا الثلاثة هي المُصدِرة لـ{g0} — تملك اثنين من ثلاثة رغم أنها لا تعاني أياً منهما. وظهر هدران تحت عنوانين: التأخير نفسه سُجّل انتظاراً في {s1} ومخزوناً في {s2}. أبقيناه انتظاراً لأن المخزون هناك عَرَض."}}, {"n": 5, "day": 1, "en": "Muda / Mura / Muri Sort", "ar": "فرز مودا / مورا / موري", "time": "15 min", "team": {"en": "Tables of 4–5", "ar": "طاولات من 4–5"}, "mod": "1.2", "out": {"en": "Template T3 completed", "ar": ""}, "purpose": {"en": "Test whether the waste you found is really waste, or the shadow of unevenness or overburden upstream.", "ar": "اختبر إن كان ما وجدته هدراً فعلاً أم ظلاً لعدم انتظام أو إرهاق في الأعلى."}, "scenario": {"en": [], "ar": []}, "instr": {"en": ["Re-sort your top ten tags into Muda, Mura and Muri on Template T3.", "For every Muda, ask once: is there a Mura upstream causing it?", "Argue it at the table. Disagreement here is the learning.", "Report how many of your ten moved out of Muda on the second pass."], "ar": ["خذ أعلى عشرة بنود من القالب T2.", "صنّف كل بند أولاً: مودا أم مورا أم موري.", "لكل مودا اسأل مرة واحدة: هل يسببه عدم انتظام في الأعلى؟", "إن كانت الإجابة نعم فانقله إلى مورا وسجّل السبب.", "عُدّ كم بنداً انتقل في الفرز الثاني."]}, "quest": {"en": ["How many of your ten moved?", "Is your overtime evidence of hard work, or evidence of Mura?"], "ar": ["كم من العشرة انتقل، وماذا يعني ذلك عن خطة تحسينكم؟", "لو عالجتم مورا واحدة فقط، كم مودا ستختفي معها؟"]}, "dec": {"en": ["Number of tags that moved out of Muda on the second pass:  ______ of 10", "Reference: Participant Manual — Module 1.2, Muda / Mura / Muri"], "ar": ["مورا الواحدة التي ستعالج أكبر عدد من أهدارنا:"]}, "data": null, "pg": 14, "tmpl": ["T3"], "model": {"en": "Four of our ten tags moved on the second pass, all from Muda to Mura. The overtime peak, the excess WIP at {s2} and the rushed checking are the same unevenness in three costumes: demand into {s1} arrives in a burst. If we level that one pattern, three of our top five disappear without being attacked.", "ar": "أربعة من بنودنا العشرة انتقلت في الفرز الثاني، كلها من مودا إلى مورا. فذروة العمل الإضافي، وفائض العمل تحت التشغيل عند {s2}، والفحص المتسرّع، هي عدم الانتظام نفسه في ثلاثة أزياء: الطلب الداخل إلى {s1} يصل دفعة واحدة. ولو سوّينا ذلك النمط الواحد لاختفت ثلاث من أعلى خمسة دون مهاجمتها."}}, {"n": 6, "day": 1, "en": "Current-State Value Stream Map", "ar": "خريطة الحالة الحالية لسلسلة القيمة", "time": "50 min", "team": {"en": "Tables of 4–5", "ar": "طاولات من 4–5"}, "mod": "1.3", "out": {"en": "A1 current-state map, Templates T4 and T5 completed", "ar": ""}, "purpose": {"en": "Draw the whole block journey on one page, including the information flow and the readiness lane, and quantify how much of the lead time is waiting.", "ar": "ارسم رحلة عمل واحد كاملة على صفحة واحدة، مع مسار المعلومات، وقِس كم من الزمن الكلي انتظار."}, "scenario": {"en": ["Your table has the Block 07 dataset (Data Pack D1), A1 paper and markers. Block 07 is a structural block currently four weeks behind its erection slot."], "ar": []}, "instr": {"en": ["Draw the material flow left to right — eleven stages, with a data box under each. Use Template T5 for the data box fields.", "Add the readiness lane above it. Where does the work order enter, who verifies it, and how long does that take today?", "Fill the timeline: process time above the line, waiting time below. Total the two separately.", "Mark a Kaizen burst at every point where a stage started without a ready work order.", "Rank your top three improvement points by hours lost per block and name a function as owner for each."], "ar": ["ارسم المراحل من اليسار لليمين وضع صندوق بيانات تحت كل مرحلة.", "أضف مسار المعلومات فوقها: من يأذن بالبدء ومتى تصل تلك المعلومة؟", "املأ القالب T5 لكل مرحلة من حزمة البيانات D1.", "املأ الخط الزمني: زمن المعالجة فوق الخط والانتظار تحته.", "اجمع كلاً على حدة واحسب نسبة زمن المعالجة إلى الزمن الكلي.", "ضع علامة تحسين حيث بدأت مرحلة بلا متطلباتها."]}, "quest": {"en": ["What is your ratio of process time to total lead time?", "How many of your top three sit upstream of the first cut?", "Which stage lost the most %C&A, and what was its readiness status at start?"], "ar": ["ما نسبتكم، وهل فاجأكم انخفاضها؟", "أي مرحلة فقدت أكبر قدر من نسبة الاكتمال والدقة؟", "هل كان أمر العمل جاهزاً عند بدء تلك المرحلة؟"]}, "dec": {"en": ["Our top three improvement points, with owning function:", "Reference: Participant Manual — Module 1.3"], "ar": ["أكبر فرصة واحدة في خريطتنا، وموضعها:"]}, "data": {"hdr": ["Total process time", "Total lead time", "Ratio (process ÷ lead)"], "rows": [["", "", ""]]}, "pg": 15, "tmpl": ["T4", "T5"], "model": {"en": "Process time 14.5 days, waiting 61.0 days, lead time 75.5 days — a ratio of 19%. The largest single loss sits before {s2}: a 12-day wait caused by {g0} arriving after the {u} was already released. %C&A falls from 94% at {s0} to 71% at {s3}, and every stage that lost accuracy was a stage that started without its prerequisites. The loss was decided before the stage began.", "ar": "زمن المعالجة 14.5 يوماً، والانتظار 61.0 يوماً، والزمن الكلي 75.5 يوماً — أي نسبة 19%. وأكبر خسارة مفردة تقع قبل {s2}: انتظار اثني عشر يوماً سببه وصول {g0} بعد إطلاق {u} فعلاً. وتنخفض نسبة الاكتمال وا , "ماذا يحدث اليوم إن لم يستجب أحد؟"]}, "dec": {"en": ["Our readiness trigger, in full:", "Reference: Participant Manual — Module 2.2"], "ar": ["محفّزاتنا الثلاثة الأولى ومستجيبوها:"]}, "data": null, "pg": 27, "tmpl": ["T14"], "model": {"en": "Three triggers stop the work: a safety condition, a quality defect found at {s2}, and {u} discovered to be not ready after release. The first two stop immediately; the third does not stop the line but escalates within 15 minutes. Responders are named by role with a maximum response of 10 minutes, escalating to the area manager. Today, if nobody responds, nothing happens — which is why the signal is currently ignored.", "ar": "ثلاثة محفّزات توقف العمل: حالة سلامة، وعيب جودة يُكتشف عند {s2}، واكتشاف أن {u} غير جاهز بعد إطلاقه. الأولان يوقفان فوراً، والثالث لا يوقف الخط لكنه يُصعَّد خلال خمس عشرة دقيقة. والمستجيبون مسمّون بالدور بأقصى استجابة عشر دقائق، ويُصعَّد لمدير المنطقة. واليوم إن لم يستجب أحد لا يحدث شيء — ولهذا تُتجاهل الإشارة حالياً."}}, {"n": 13, "day": 2, "en": "Standard Work Sheet", "ar": "ورقة العمل القياسي", "time": "45 min", "team": {"en": "Tables of 4–5", "ar": "طاولات من 4–5"}, "mod": "2.3", "out": {"en": "Template T15 completed", "ar": ""}, "purpose": {"en": "Write a job breakdown sheet for a repetitive task your table actually performs, with safety checkpoints as numbered steps and a standard time on every step.", "ar": "اكتب أفضل تسلسل معروف لمهمة متكررة، مع المشغّل، وبزمن قياسي لكل خطوة."}, "scenario": {"en": [], "ar": []}, "instr": {"en": ["Choose a task your table actually performs — not a hypothetical one.", "Write the major steps, then the key points, then the reasons, in the operator's own words.", "Insert the safety checkpoints as numbered steps: hot-work permit, gas test, confined-space entry.", "Attach a standard time to every step and total it on Template T15.", "Mark any step that changes for first-of-class work and exclude it from the standard."], "ar": ["اختر مهمة متكررة يتفاوت أداؤها بين الأشخاص.", "اكتبها مع من ينفّذها لا نيابة عنه.", "سجّل زمناً قياسياً لكل خطوة في القالب T15.", "حدّد نقاط الجودة الحرجة ونقاط السلامة.", "اختبرها بأن ينفّذها شخص آخر."]}, "quest": {"en": ["Who wrote this sheet — the operator or the supervisor?", "Which step would two experienced people most likely perform differently?", "What proportion of a normal shift in your area is genuinely first-of-class work?"], "ar": ["أين كان أكبر تفاوت بين الأشخاص؟", "هل المعيار قيد على المهارة أم نقطة انطلاق للتحسين؟"]}, "dec": {"en": ["Total standard time for our task:  ______ minutes", "Reference: Participant Manual — Module 2.3"], "ar": ["المهمة التي قنّناها ومالك تحديثها:"]}, "data": null, "pg": 29, "tmpl": ["T15"], "model": {"en": "We standardised the handover check into {s2}, where two experienced people differed by 40% in time and by three steps in sequence. Written with the two operators in the area, not for them. Standard time 22 minutes across 9 steps, with two critical quality points and one safety point marked. Tested by a third person who completed it in 24 minutes on first attempt.", "ar": "قنّنّا فحص التسليم إلى {s2}، حيث اختلف خبيران بنسبة 40% في الزمن وبثلاث خطوات في التسلسل. كُتب مع المشغّلَين في المنطقة لا نيابة عنهما. الزمن القياسي 22 دقيقة على تسع خطوات، مع نقطتي جودة حرجتين ونقطة سلامة واحدة. واختبره ثالث فأنجزه في 24 دقيقة من المحاولة الأولى."}}, {"n": 14, "day": 2, "en": "Work Observation and Timing", "ar": "ملاحظة العمل وتوقيته", "time": "20 min", "team": {"en": "Pairs within the table", "ar": "Pairs within the table"}, "mod": "2.3", "out": {"en": "Completed timing sheet, carried into Activity 17", "ar": ""}, "purpose": {"en": "Time the same task performed twice and quantify the variation, so that Day 3's line balancing has real inputs rather than opinions.", "ar": "قِس ما يحدث فعلاً بدل الاعتماد على ما يُفترض أنه يحدث."}, "scenario": {"en": [], "ar": []}, "instr": {"en": ["Two people at your table perform the task from Activity 13, one after the other. A third times each step.", "Record both times against the standard work sheet steps.", "Calculate the variation per step and the variation in total.", "Identify the single step contributing most of the variation.", "Workspace — complete this"], "ar": ["راقب دورة كاملة دون تدخل أو تعليق.", "سجّل زمن كل خطوة على حدة.", "افصل القيمة المضافة عن غير المضافة عن الضرورية غير المضافة.", "كرّر الملاحظة ثلاث مرات على الأقل.", "احسب نسبة القيمة المضافة."]}, "quest": {"en": ["What was the total variation between the two runs, as a percentage?", "Was the largest variation in a value-adding step or in a setup or search step?"], "ar": ["ما نسبة القيمة المضافة، وأين ذهب الباقي؟", "هل اختلف ما رأيته عما توقعته؟"]}, "dec": {"en": ["The step contributing most of the variation, and why:", "Reference: Participant Manual — Module 2.3; Module 3.1", "Eight activities. You set the rate, find the constraint, rebalance the line, decide what can be pulled, design the loop, size the ready backlog and cut the dock changeover."], "ar": ["أكبر خطوة غير مضافة للقيمة، وكيف نزيلها:"]}, "data": null, "pg": 31, "tmpl": [], "model": {"en": "Across three observed cycles: value-adding 31%, necessary non-value-adding 22%, pure waste 47%. The largest single non-value element is walking to retrieve inputs that should have been staged — 18 minutes per cycle. What we saw differed sharply from what we expected: we assumed the bottleneck was the work itself, and it is the fetching around the work.", "ar": "عبر ثلاث دورات مرصودة: القيمة المضافة 31%، وغير المضافة الضرورية 22%، والهدر الصافي 47%. وأكبر عنصر غير مضاف هو المشي لجلب مدخلات كان ينبغي تجهيزها — ثماني عشرة دقيقة لكل دورة. واختلف ما رأيناه بحدة عما توقعناه: افترضنا أن العائق العمل نفسه، وهو الجلب حول العمل."}}, {"n": 15, "day": 3, "en": "Takt Calculation", "ar": "حساب زمن التاكت", "time": "15 min", "team": {"en": "Tables of 4–5", "ar": "طاولات من 4–5"}, "mod": "3.1", "out": {"en": "Template T16 completed", "ar": ""}, "purpose": {"en": "Derive takt time backwards from a programme milestone rather than from a shop's view of its own capacity.", "ar": "اشتق التاكت من معلم البرنامج لا من رأي الورشة في سرعتها."}, "scenario": {"en": ["CORVETTE ALPHA has eleven blocks remaining to erect and forty-four working days to erection complete. The panel line runs a single eight-hour shift."], "ar": []}, "instr": {"en": ["Calculate available production time in the period, using Data Pack D1 programme inputs.", "Establish the number of blocks required in that period.", "Divide to obtain takt time, and record it on Template T16.", "Convert takt into a daily block-completion target and a station cycle time.", "Workspace — complete this"], "ar": ["حدّد الزمن المتاح فعلاً بعد الاستراحات والصيانة.", "حدّد الطلب من معلم البرنامج لا من الطاقة.", "اقسم المتاح على الطلب في القالب T16.", "سجّل مصدر كل رقم.", "قارن التاكت بزمن دورة كل محطة."]}, "quest": {"en": ["Does anyone in your bay currently know the takt time implied by the milestone plan?", "What happens to takt if the erection-complete milestone moves two weeks earlier?"], "ar": ["أي محطات تتجاوز التاكت؟ تلك أعناق زجاجة بالتعريف.", "ما الفرق بين زمن الدورة والتاكت في كلماتكم؟"]}, "dec": {"en": ["Takt time  =  ______ minutes per panel", "Reference: Participant Manual — Module 3.1"], "ar": ["تاكتنا المحسوب ومصدر كل مُدخل:"]}, "data": null, "pg": 33, "tmpl": ["T16"], "model": {"en": "Available time 27,000 minutes per period after breaks and planned maintenance; demand 15 units from the programme milestone. Takt = 1,800 minutes per unit. Two stages exceed it: {s2} at 2,150 and {s3} at 1,940. Those two are bottlenecks by definition, whatever the shop believes about its own speed. Takt is the rhythm of demand; cycle time is what we currently do.", "ar": "الزمن المتاح 27,000 دقيقة في الفترة بعد الاستراحات والصيانة المخططة، والطلب 15 وحدة من معلم البرنامج. فالتاكت 1,800 دقيقة للوحدة. ومرحلتان تتجاوزانه: {s2} عند 2,150 و{s3} عند 1,940. وهاتان عنقا زجاجة بالتعريف مهما اعتقدت الورشة عن سرعتها. فالتاكت إيقاع الطلب، وزمن الدورة ما نفعله حالياً."}}, {"n": 16, "day": 3, "en": "Bottleneck Identification", "ar": "تحديد عنق الزجاجة", "time": "15 min", "team": {"en": "Tables of 4–5", "ar": "طاولات من 4–5"}, "mod": "3.1", "out": {"en": "Template T17 partially completed", "ar": ""}, "purpose": {"en": "Plot every station against takt and identify the constraint — and the stations with spare capacity you can borrow from.", "ar": "حدّد المحطة التي تحكم إنتاجية النظام كله، وميّزها عن المحطة الأكثر ضجيجاً."}, "scenario": {"en": [], "ar": []}, "instr": {"en": ["Plot the five station times from Data Pack D2 against your takt figure on Template T17.", "Mark the station that exceeds takt. That station is the programme.", "Mark the stations under takt and calculate the spare capacity in minutes for each.", "Calculate the percentage by which the bottleneck exceeds takt."], "ar": ["ارسم أزمنة دورة كل المحطات مقابل التاكت.", "حدّد المحطة الأعلى زمناً.", "تحقق من المخزون المتراكم قبلها كدليل مؤيد.", "افحص هل عنق الزجاجة ثابت أم متنقل.", "احسب أثر تحسينه على إنتاجية النظام."]}, "quest": {"en": ["By what percentage does the bottleneck exceed takt?", "How much total spare capacity exists across the other four stations?", "If you improved a station that is already under takt, what would the line gain?"], "ar": ["هل عنق الزجاجة هو المحطة التي كنتم تشتكون منها؟", "ماذا يحدث لو حسّنتم محطة غير عنق الزجاجة؟"]}, "dec": {"en": ["Bottleneck station: ____________   Excess over takt: ______%", "Reference: Participant Manual — Module 3.1"], "ar": ["عنق زجاجتنا والدليل الرقمي عليه:"]}, "data": null, "pg": 35, "tmpl": ["T17"], "model": {"en": "{s2} governs throughput at 2,150 minutes against a takt of 1,800. The confirming evidence is the queue standing in front of it — the largest accumulation in the whole flow. It is not the stage we complained about most; that one is simply the noisiest. Improving any non-bottleneck stage changes system output by zero.", "ar": "{s2} هي التي تحكم الإنتاجية عند 2,150 دقيقة مقابل تاكت 1,800. والدليل المؤيد الطابور الواقف أمامها — وهو أكبر تراكم في التدفق كله. وهي ليست المرحلة التي كنا نشتكي منها أكثر؛ تلك أكثرها ضجيجاً فقط. وتحسين أي مرحلة غير عنق الزجاجة يغيّر إنتاجية النظام بمقدار صفر."}}, {"n": 17, "day": 3, "en": "Line Balancing", "ar": "موازنة الخط", "time": "30 min", "team": {"en": "Tables of 4–5", "ar": "طاولات من 4–5"}, "mod": "3.1", "out": {"en": "Template T17 completed with two solutions", "ar": ""}, "purpose": {"en": "Move work content between stations until every one sits under takt, and name the trade that will object.", "ar": "أعد توزيع محتوى العمل بحيث تقترب كل محطة من التاكت دون تجاوزه."}, "scenario": {"en": [], "ar": []}, "instr": {"en": ["Identify which work content could physically move from the bottleneck to an underloaded station.", "Move it on Template T17 and recalculate every station time.", "State exactly what you moved, where it went, and what enables it to move.", "Name the trade or function that will object, and what you would say to them.", "Produce a second solution that does not involve adding people.", "Workspace — complete this"], "ar": ["اسرد المحطات وأزمنتها الحالية في القالب T17.", "حدّد المحطات فوق التاكت وتحته.", "انقل محتوى عمل لا أفراداً.", "تحقق من القيود الفنية قبل كل نقل.", "أعد الحساب بعد النقل."]}, "quest": {"en": ["Did your rebalance create a new bottleneck?", "What upstream condition would make your balance collapse in week two?", "What does your second solution do that the first does not?"], "ar": ["كم محطة صارت تحت التاكت بعد الموازنة؟", "ما القيد الذي منعكم من موازنة كاملة؟"]}, "dec": {"en": ["Our rebalanced line, and the trade we need to convince:", "Reference: Participant Manual — Module 3.1"], "ar": ["نقل محتوى العمل الذي سننفّذه ومالكه:"]}, "data": null, "pg": 37, "tmpl": ["T17"], "model": {"en": "We moved 350 minutes of work content out of {s2} — the inspection and labelling step — into {s1}, which was running 600 minutes under takt. After the move, {s2} sits at 1,800 and {s1} at 1,750, both at or under takt. We moved work content, not people. The remaining constraint is a certification requirement that prevents moving the final check.", "ar": "نقلنا 350 دقيقة من محتوى العمل خارج {s2} — خطوة الفحص والوسم — إلى {s1} التي كانت تعمل 600 دقيقة تحت التاكت. وبعد النقل صارت {s2} عند 1,800 و{s1} عند 1,750، كلتاهما عند التاكت أو تحته. نقلنا محتوى عمل لا أفراداً. والقيد المتبقي متطلب اعتماد يمنع نقل الفحص النهائي."}}, {"n": 18, "day": 3, "en": "Push or Pull? Ten Decisions", "ar": "دفع أم سحب؟ عشرة قرارات", "time": "15 min", "team": {"en": "Tables of 4–5", "ar": "طاولات من 4–5"}, "mod": "3.2", "out": {"en": "Completed decision grid", "ar": ""}, "purpose": {"en": "Sort ten shipyard material categories into two-bin kanban, pull-by-signal, or expedite-by-need-date, and discover that the sorting rule is lead time rather than material type.", "ar": "ميّز متى يكون الدفع صحيحاً ومتى يكون السحب صحيحاً بدل تطبيق قاعدة واحدة."}, "scenario": {"en": [], "ar": []}, "instr": {"en": ["For each of the ten items, decide: two-bin kanban, pull-by-signal, or expedite-by-need-date.", "Record your decision and a one-line reason for each.", "Mark the three your table disagreed on most.", "State the sorting rule you actually used, in one sentence.", "Workspace — complete this"], "ar": ["اقرأ القرارات العشرة واحداً واحداً.", "صنّف كل قرار: دفع أم سحب.", "اكتب سبباً واحداً لكل تصنيف.", "حدّد القرارات التي اختلفت طاولتكم عليها.", "ناقش الاختلافات قبل الاستماع للإجابة."]}, "quest": {"en": ["Which three did you disagree on?", "Was the disagreement about the material, or about the lead time?"], "ar": ["أي القرارات كان الدفع فيها هو الصحيح، ولماذا؟", "متى ينقل السحب الفوضى بدل إزالتها؟"]}, "dec": {"en": ["The sorting rule we actually used:", "Reference: Participant Manual — Module 3.2"], "ar": ["قرارنا في البندين المختلف عليهما، والسبب:"]}, "data": null, "pg": 39, "tmpl": [], "model": {"en": "Seven of the ten were pull, three were push. Push was correct where the input is a long-lead item ordered against a forecast — the signal cannot wait for consumption. We disagreed on two: the replenishment of consumables at {s1}, which we settled as pull, and the release into {s3}, which stays push until the readiness gate is stable. Pull without a readiness gate just moves the chaos.", "ar": "سبعة من العشرة سحب، وثلاثة دفع. وكان الدفع صحيحاً حيث المُدخل صنف طويل الأمد يُطلب مقابل توقّع — فالإشارة لا تستطيع انتظار الاستهلاك. واختلفنا على اثنين: تزويد المستهلكات عند {s1} وحسمناه سحباً، والإطلاق إلى {s3} ويبقى دفعاً حتى تستقر بوابة الجاهزية. فالسحب بلا بوابة جاهزية ينقل الفوضى فقط."}}, {"n": 19, "day": 3, "en": "Kanban Card and Replenishment Loop", "ar": "بطاقة كانبان وحلقة التزويد", "time": "25 min", "team": {"en": "Tables of 4–5", "ar": "طاولات من 4–5"}, "mod": "3.2", "out": {"en": "Templates T18 and T19 completed", "ar": ""}, "purpose": {"en": "Design a working kanban card and the replenishment loop behind it for one outfitting-material category, including the readiness status field.", "ar": "صمّم حلقة تزويد واحدة كاملة بأرقام محسوبة لا مقدّرة."}, "scenario": {"en": [], "ar": []}, "instr": {"en": ["Choose one category: pipe spools, cable reels, or standard fittings.", "Design the card on Template T18: block ID, erection zone, quantity, trigger point, supplier, readiness status.", "Set the trigger point and the lead-time buffer, and be ready to defend both numbers.", "Draw the replenishment loop on Template T19, from consumption to card return.", "State what happens when the card returns and the bin is not empty."], "ar": ["اختر فئة مادة واحدة عالية الاستهلاك.", "احسب الاستهلاك اليومي وزمن التزويد.", "احسب نقطة الإطلاق وكمية البطاقة.", "املأ البطاقة في القالب T18 والحلقة في T19.", "حدّد من يعيد البطاقة ومتى."]}, "quest": {"en": ["How did you arrive at your trigger point?", "How does the bay know the kit is complete when the card arrives?", "What breaks your loop first — a supplier delay or a sequence change?"], "ar": ["ماذا يحدث للحلقة إن لم تعد البطاقة؟", "هل عمليتكم مستقرة كفاية لتحمل كانبان؟"]}, "dec": {"en": ["Our trigger point and lead-time buffer, with the reasoning:", "Reference: Participant Manual — Module 3.2"], "ar": ["حلقتنا الأولى ومالكها:"]}, "data": null, "pg": 41, "tmpl": ["T18", "T19"], "model": {"en": "Loop built for the consumable that stops {s1} most often. Daily consumption 40, replenishment lead time 3 days, safety 1 day: trigger point 160, card quantity 80, two cards in circulation. The store keeper returns the card with the delivery — if the card does not return the loop breaks silently and we discover it at the next stockout. Our process is stable enough here; it would not be at {s2}.", "ar": "بُنيت الحلقة للمستهلك الذي يوقف {s1} أكثر من غيره. الاستهلاك اليومي 40، وزمن التزويد 3 أيام، والأمان يوم: فنقطة الإطلاق 160، وكمية البطاقة 80، وبطاقتان في التداول. ويعيد أمين المخزن البطاقة مع التسليم — فإن لم تعد انكسرت الحلقة بصمت واكتشفناها عند النفاد التالي. وعمليتنا مستقرة كفاية هنا، ولن تكون كذلك عند {s2}."}}, {"n": 20, "day": 3, "en": "Ready-Backlog Simulation", "ar": "محاكاة المخزون الجاهز", "time": "35 min", "team": {"en": "Cross-functional tables", "ar": "طاولات متعددة الوظائف"}, "mod": "3.2", "out": {"en": "Template T20 completed with a sizing decision", "ar": ""}, "purpose": {"en": "Size a ready backlog by running three rounds at different sizes and observing what each one costs.", "ar": "اختبر أثر الاحتفاظ بمخزون من العمل الجاهز فقط بدل إطلاق ما يحين تاريخه."}, "scenario": {"en": ["Your bay has capacity for one work order per takt period. Twelve CORVETTE ALPHA work orders sit in the three-week window: five green, four amber, three red.", "The trainer controls release. You control only which ready work order you pull next."], "ar": []}, "instr": {"en": ["Round A — hold a backlog of one. Record what happens when the bay finishes early.", "Round B — hold a backlog of two. Record how the bay behaves when a green turns red on Tuesday.", "Round C — hold a backlog of five. Record how many drawing revisions land on work not yet started.", "Record all three rounds on Template T20.", "Decide the backlog size you would run in your own bay, in takt periods, and defend the number.", "Workspace — complete this"], "ar": ["ابدأ بالوضع الحالي: أطلق حسب التاريخ.", "سجّل عدد التوقفات وإعادات العمل في القالب T20.", "أعد الجولة: لا تُطلق إلا ما هو جاهز موثّق.", "احتفظ بمخزون جاهز لا يقل عن فترتي تاكت.", "قارن المقياسين بين الجولتين."]}, "quest": {"en": ["Which backlog size gave the best flow?", "What did the largest backlog cost you that the board did not show?", "How wide is the frozen window in your own area, and who is allowed to break it?"], "ar": ["كم تغيّر عدد التوقفات بين الجولتين؟", "كم فترة تاكت من المخزون الجاهز تحتاجون فعلاً؟"]}, "dec": {"en": ["Our ready backlog size, in takt periods, and why:", "Reference: Participant Manual — Module 3.2, Ready backlog; Reference R9"], "ar": ["حجم المخزون الجاهز الذي سنلتزم به:"]}, "data": null, "pg": 43, "tmpl": ["T20"], "model": {"en": "Round one, releasing by date: 11 stoppages and 6 items reworked. Round two, releasing only verified-ready work with a buffer of two takt periods: 3 stoppages and 1 rework. We will commit to a ready backlog of two takt periods — enough to absorb one late confirmation without ever starting a not-ready item.", "ar": "الجولة الأولى بالإطلاق حسب التاريخ: أحد عشر توقفاً وستة أعمال معادة. والجولة الثانية بإطلاق العمل المؤكد جاهزيته فقط مع مخزون فترتي تاكت: ثلاثة توقفات وإعادة واحدة. وسنلتزم بمخزون جاهز بفترتي تاكت — يكفي لامتصاص تأكيد متأخر واحد دون أن نبدأ عملاً غير جاهز أبداً."}}, {"n": 21, "day": 3, "en": "SMED Classification", "ar": "تصنيف SMED", "time": "20 min", "team": {"en": "Tables of 4–5", "ar": "طاولات من 4–5"}, "mod": "3.3", "out": {"en": "Template T21 partially completed", "ar": ""}, "purpose": {"en": "Classify every element of a dock changeover as internal or external, and total the internal time you are actually attacking.", "ar": "افصل العمل الداخلي عن الخارجي في تحويل حقيقي قبل محاولة تسريع أي منهما."}, "scenario": {"en": ["The CORVETTE ALPHA dock changeover between block erections was recorded at eight hours of internal time. Eight elements were logged."], "ar": []}, "instr": {"en": ["Transfer the eight elements from Data Pack D5 onto Template T21 with their times.", "Classify each as internal or external. Do not allow a maybe.", "For every element you classified internal, ask whether it could have been done while the previous block was still in dock.", "Total the internal time. That is the number you are attacking."], "ar": ["اسرد كل خطوة في التحويل بالترتيب.", "صنّف كل خطوة: داخلية تتطلب التوقف، أم خارجية.", "سجّل زمن كل خطوة في القالب T21.", "اجمع الداخلي والخارجي على حدة.", "حدّد الخطوات الداخلية القابلة للتحويل إلى خارجية."]}, "quest": {"en": ["How much of the eight hours is genuinely internal?", "Which element surprised your table most?"], "ar": ["كم بالمئة من التحويل كان خارجياً أصلاً؟", "أي خطوة داخلية يمكن تحويلها بأقل كلفة؟"]}, "dec": {"en": ["Internal time before conversion:  ______ minutes", "Reference: Participant Manual — Module 3.3"], "ar": ["الخطوات التي سنحوّلها إلى خارجية:"]}, "data": null, "pg": 45, "tmpl": ["T21"], "model": {"en": "Total changeover 96 minutes: 71 internal, 25 external. But 34 of the internal minutes are fetching, staging and paperwork that require no stoppage at all — they are internal only by habit. So 26% is external today and a further 35% can become external at no cost. The cheapest conversion is pre-staging the tooling in the shift before.", "ar": "إجمالي التحويل 96 دقيقة: 71 داخلية و25 خارجية. لكن 34 دقيقة من الداخلية جلبٌ وتجهيزٌ وأوراق لا تتطلب توقفاً إطلاقاً — فهي داخلية بالعادة فقط. إذاً 26% خارجية اليوم و35% إضافية يمكن أن تصبح خارجية بلا كلفة. وأرخص تحويل تجهيز العدة مسبقاً في الوردية السابقة."}}, {"n": 22, "day": 3, "en": "SMED Improvement and Target", "ar": "تحسين SMED والهدف", "time": "20 min", "team": {"en": "Tables of 4–5", "ar": "طاولات من 4–5"}, "mod": "3.3", "out": {"en": "Template T21 completed with a committed target", "ar": ""}, "purpose": {"en": "Convert internal elements to external, state what must change to allow each conversion, and commit to a reduction target you would defend to the dock master.", "ar": "حوّل ثم بسّط ثم وازِ، واستهدف تقليصاً بالنصف لا بنسبة صغيرة."}, "scenario": {"en": [], "ar": []}, "instr": {"en": ["Convert every element you can, and for each state what must change — equipment, permission, or simply asking earlier.", "Recalculate the internal time after conversion on Template T21.", "Calculate the percentage reduction.", "Commit to a target your table would defend to the dock master.", "Workspace — complete this"], "ar": ["حوّل كل خطوة داخلية ممكنة إلى خارجية أولاً.", "بسّط ما تبقى داخلياً: أدوات سريعة، إعدادات مسبقة.", "وازِ الخطوات القابلة للتنفيذ المتوازي.", "احسب الزمن الجديد وقارنه بالأصلي.", "حدّد هدفاً ومالكاً وتاريخاً."]}, "quest": {"en": ["What proportion of the original internal time was convertible?", "What is stopping the conversion today — equipment, permission, or nobody having asked?", "Which conversion would also improve safety?"], "ar": ["هل بلغتم تقليصاً بالنصف؟ وإن لا، ما القيد؟", "ماذا يتيح لكم التحويل الأقصر أن تفعلوه؟"]}, "dec": {"en": ["Our committed target reduction, and the first conversion we would make:", "Reference: Participant Manual — Module 3.3", "Eight activities. You error-proof the defects, reach root cause by evidence, run the meeting that sustains it, and prove the whole four days in the capstone."], "ar": ["هدفنا الجديد للتحويل ومالكه:"]}, "data": null, "pg": 47, "tmpl": ["T21"], "model": {"en": "Convert 34 minutes to external, simplify the remaining internal with quick-release fittings and pre-set positions saving 12 minutes, and parallelise two steps saving 6. Changeover falls from 96 to 44 minutes — a 54% reduction, past the halving target. Owner: maintenance lead, by the end of the quarter. The shorter changeover lets us halve the batch and cut WIP before {s2}.", "ar": "تحويل 34 دقيقة إلى خارجية، وتبسيط المتبقي الداخلي بوصلات سريعة ومواضع مضبوطة مسبقاً توفّر 12 دقيقة، ومَوْزَنَة خطوتين توفّر 6. فينخفض التحويل من 96 إلى 44 دقيقة — أي 54%، متجاوزاً هدف النصف. المالك: رئيس الصيانة بنهاية الربع. والتحويل الأقصر يتيح تنصيف الدفعة وخفض العمل تحت التشغيل قبل {s2}."}}, {"n": 23, "day": 4, "en": "Poka-Yoke Challenge", "ar": "تحدي منع الخطأ", "time": "30 min", "team": {"en": "Tables of 4–5", "ar": "طاولات من 4–5"}, "mod": "4.1", "out": {"en": "Template T22 completed", "ar": ""}, "purpose": {"en": "Design error-proofing devices for the three most repeatable defects, and distinguish prevention from detection.", "ar": "صمّم أجهزة تمنع العيوب المتكررة بدل الاعتماد على انتباه الإنسان."}, "scenario": {"en": [], "ar": []}, "instr": {"en": ["Sort the defect log in Data Pack D4 by frequency, not by severity.", "Pick the three most repeatable failures — repeatable, because those are the ones a device can stop.", "For each, design an error-proofing device or check on Template T22, and state where in the process it sits.", "Classify each device: does it prevent, detect, or only record?", "Estimate what each would cost and how long it would take to put in place."], "ar": ["اختر ثلاثة عيوب متكررة من سجل العيوب.", "لكل عيب صمّم جهازاً أو فحصاً في القالب T22.", "صنّفه: يمنع أم يكشف أم يسجّل.", "فضّل المنع على الكشف والأرخص على الأغلى.", "حدّد موضعه وكلفته التقريبية."]}, "quest": {"en": ["How many of your three prevent rather than detect?", "Which one could be in place within thirty days?", "NCR-223 has the smallest count on the list. Why might it be the most expensive?"], "ar": ["كم من حلولكم يمنع فعلاً لا يكشف فقط؟", "هل أي منها يضيف خطوة فحص وتسمّونه منعاً؟"]}, "dec": {"en": ["The one device we would install first, and what it would cost:", "Reference: Participant Manual — Module 4.1"], "ar": ["الجهاز الذي سننفّذه أولاً ومالكه:"]}, "data": {"hdr": ["Defect", "Device or check", "Where it sits", "Prevents / detects / records"], "rows": [["", "", "", ""], ["", "", "", ""], ["", "", "", ""]]}, "pg": 49, "tmpl": ["T22"], "model": {"en": "Three devices. For the most frequent defect: a physical guide that makes the incorrect orientation impossible to assemble — prevention, cost negligible. For the second: a weight check that halts the conveyor outside tolerance — detection, moderate cost. For the third: an automatic log entry — recording only. Two of the three prevent rather than detect. We rejected a fourth idea because it was an added inspection step wearing the name of prevention.", "ar": "ثلاثة أجهزة. للعيب الأكثر تكراراً: دليل مادي يجعل الاتجاه الخاطئ مستحيل التجميع — منع بكلفة تكاد لا تُذكر. وللثاني: فحص وزن يوقف الناقل خارج السماحية — كشف بكلفة متوسطة. وللثالث: تسجيل تلقائي — تسجيل فقط. اثنان من الثلاثة يمنعان لا يكشفان. ورفضنا فكرة رابعة لأنها خطوة فحص إضافية ترتدي اسم المنع."}}, {"n": 24, "day": 4, "en": "Defect Log Analysis", "ar": "تحليل سجل العيوب", "time": "20 min", "team": {"en": "Tables of 4–5", "ar": "طاولات من 4–5"}, "mod": "4.1", "out": {"en": "Template T23 completed", "ar": ""}, "purpose": {"en": "Read a defect log as a diagnosis rather than a record, separating defects caused at the station from defects caused upstream.", "ar": "حدّد أين يُصنع العيب مقابل أين يُكتشف، وهي المسافة التي تحدد الكلفة."}, "scenario": {"en": [], "ar": []}, "instr": {"en": ["Transfer the six entries from Data Pack D4 onto Template T23.", "For each, mark whether the root cause sits at the station, upstream in engineering or procurement, or in the management system.", "Calculate what proportion of total defect frequency has a root cause outside the bay.", "Identify which entries a station-level poka-yoke could not stop.", "Workspace — complete this"], "ar": ["صنّف عيوب السجل حسب مرحلة الاكتشاف.", "حدّد لكل عيب المرحلة التي صُنع فيها.", "احسب المسافة بين الصنع والاكتشاف.", "رتّب حسب التكرار مضروباً بالمسافة.", "حدّد أعلى ثلاثة."]}, "quest": {"en": ["What proportion of defect frequency has a root cause outside the bay?", "Which function owns the largest share of that proportion?"], "ar": ["أي عيب لديه أكبر مسافة بين صنعه واكتشافه؟", "ماذا يكلّفكم تأخر الاكتشاف مرحلتين؟"]}, "dec": {"en": ["Proportion of defect frequency caused outside the bay:  ______%", "Reference: Participant Manual — Module 4.1"], "ar": ["العيب الذي سنعالج نقطة صنعه:"]}, "data": null, "pg": 51, "tmpl": ["T23"], "model": {"en": "The defect with the greatest distance is created at {s0} and found at {s3} — three stages downstream, 18 occurrences last quarter. By the time {c} finds it, the item has absorbed the cost of every intervening stage, which is why a defect found three stages late costs roughly eight times one found at source. We will move the check to the point of creation.", "ar": "العيب الأكبر مسافةً يُصنع عند {s0} ويُكتشف عند {s3} — ثلاث مراحل لاحقة، و18 حالة الربع الماضي. وحين يجده {c} يكون الصنف قد استوعب كلفة كل مرحلة وسيطة، ولهذا يكلّف العيب المكتشف بعد ثلاث مراحل نحو ثمانية أضعاف المكتشف عند المصدر. وسننقل الفحص إلى نقطة الصنع."}}, {"n": 25, "day": 4, "en": "Five Whys", "ar": "الأسباب الخمسة", "time": "20 min", "team": {"en": "Tables of 4–5", "ar": "طاولات من 4–5"}, "mod": "4.2", "out": {"en": "Template T24 completed", "ar": ""}, "purpose": {"en": "Follow one causal chain to a systemic root cause, writing every why down so the chain is evidence rather than assertion.", "ar": "انزل من العَرَض إلى السبب الجذري بسلسلة سببية يمكن اختبارها."}, "scenario": {"en": ["Take NCR-223 — a pipe spool installed to a superseded revision, fourteen occurrences last quarter."], "ar": []}, "instr": {"en": ["Write the problem statement at the top of Template T24, with the frequency.", "Ask why and write the answer. Then ask why of that answer. Continue to five.", "Write every why down, not just the last one.", "Test the chain backwards: does each answer genuinely cause the one above it?", "Stop when you reach a cause that is systemic — a missing rule, ownership or interface — not a person."], "ar": ["اكتب المشكلة بصياغة محددة وقابلة للقياس.", "اسأل لماذا واكتب الإجابة ثم اسأل عنها.", "اختبر كل حلقة: هل إزالتها تمنع ما فوقها؟", "توقّف حين تصل إلى سبب تملكه وتستطيع تغييره.", "لا تتوقف عند سبب يسمّي شخصاً."]}, "quest": {"en": ["Did your chain stop at a person? If so, keep going.", "Is your root cause something a rule change could fix?"], "ar": ["عند أي مستوى وصلتم إلى سبب تملكونه؟", "هل انتهت سلسلتكم عند شخص أم عند عملية؟"]}, "dec": {"en": ["Our root cause, stated in one sentence:", "Reference: Participant Manual — Module 4.2"], "ar": ["السبب الجذري وإجراء منعه:"]}, "data": null, "pg": 53, "tmpl": ["T24"], "model": {"en": "Problem: “{pain}”, occurring 4 times a month. Why 1 — the input arrives incomplete. Why 2 — it is released before {g1} is confirmed. Why 3 — confirmation is verbal and unrecorded. Why 4 — there is no field for it in the release form. Why 5 — the form was designed for a schedule check, not a readiness check. We stopped at level five because it is a cause we own and can change. The chain ends at a process, not at a person.", "ar": "المشكلة: «{pain}» بتكرار أربع مرات شهرياً. لماذا 1 — المُدخل يصل ناقصاً. لماذا 2 — يُطلق قبل تأكيد {g1}. لماذا 3 — التأكيد شفهي وغير مسجّل. لماذا 4 — لا يوجد حقل له في نموذج الإطلاق. لماذا 5 — النموذج صُمّم لفحص جدول لا لفحص جاهزية. توقفنا عند الخامس لأنه سبب نملكه ونستطيع تغييره. والسلسلة تنتهي عند عملية لا عند شخص."}}, {"n": 26, "day": 4, "en": "Fishbone Analysis", "ar": "تحليل هيكل السمكة", "time": "20 min", "team": {"en": "Tables of 4–5", "ar": "طاولات من 4–5"}, "mod": "4.2", "out": {"en": "Template T25 completed", "ar": ""}, "purpose": {"en": "Open the search for causes across six categories when the causal chain is not obvious.", "ar": "وسّع البحث عن الأسباب عبر فئات متعددة قبل التركيز على واحدة."}, "scenario": {"en": ["Take NCR-204 — weld porosity on FCAW butt joints, thirty-one occurrences last quarter. Unlike NCR-223, there is no single obvious chain."], "ar": []}, "instr": {"en": ["Write the effect in the head of the fishbone on Template T25.", "Populate a function doneSet(){ const s=new Set(); ACTS.forEach(a=>{ if(S.actDone["a"+a.n]) s.add(a.n); }); return s; }
function slotFill(str){
  const s=slots();
  return String(str).replace(/\{(\w+)\}/g,(m,k)=>{
    if(k==="u") return s.unit; if(k==="c") return s.cust; if(k==="sec") return s.sec;
    if(k==="proc") return s.proc; if(k==="pain") return s.pain;
    if(k[0]==="s"&&k.length===2) return s.st[+k[1]]||m;
    if(k[0]==="g"&&k.length===2) return s.gate[+k[1]]||m;
    if(k[0]==="w"&&k.length===2) return s.waste[+k[1]]||m;
    return m;
  });
}
function refBar(items){
  const T_=t();

}

function fillAct(n){

  (a.tmpl||[]).forEach(id=>{
    const tp=TMPLS.find(x=>x.id===id); if(!tp||!tp.model) return;
    const rows=(isAr()?tp.model.ar:tp.model.en).map(r=>r.map(c=>slotFill(c)));

  });
  return true;
}

  return `<div class="chart">`+items.map(i=>
    `<div class="crow"><span class="cl">${esc(i.l)}</span>
      <div class="ct"><i style="width:${(i.v/mx*100).toFixed(1)}%;background:${i.c||color||"var(--sky)"}"></i></div>
      <b>${i.v}${unit||""}</b></div>`).join("")+`</div>`;
}

          <div class="dayleg"><span><i class="lv"></i>${esc(T_.valueDays)}</span><span><i class="lw"></i>${esc(T_.waitDays)}</span>
          ${res.rework?`<span><i class="lr"></i>${esc(T_.reworkDays)}</span>`:""}
          <b>${esc(T_.totalDays)}: ${res.total}d</b>${res.saved>0?`<em class="good">−${res.saved}d</em>`:""}</div>`;
        if(res.early) h+=`<div class="warn">${esc(T_.earlyWarn)}</div>`;
      }
      h+=`<div class="row wrap">`;
      if(!sts) h+=`<button class="btn tiny primary" data-raise="${st.id}">${esc(T_.raise)}</button>`;
      if(sts==="raised") h+=ready
        ? `<button class="btn tiny primary" data-rel="${st.id}">${esc(T_.release)}</button>`
        : `<button class="btn tiny warnbtn" data-relx="${st.id}">${esc(T_.releaseEarly)}</button>`;

      if(sts==="done") h+=`<button class="btn tiny ghost" data-reop="${st.id}">${esc(T_.reopen)}</button>`;
