/* ---- simulator ---- */
function vSim(){
  const T_=t(),ov=overall(),ds=doneSet();
  let h=head(T_.simTitle,T_.simLead);
  if(ov===null||ds.size===0) return h+`<div class="card"><p class="muted">${esc(T_.simNone)}</p>
    <div class="row"><button class="btn primary" data-go="assess">${esc(T_.nav.assess)} →</button></div></div>`;
  const r=simulate(ds,ov);
  const M=[["mLead",r.base.lead,r.after.lead,"d",true],["mReady",r.base.ready,r.after.ready,"%",false],
           ["mStop",r.base.stop,r.after.stop,"",true],["mRework",r.base.rework,r.after.rework,"",true],
           ["mRatio",r.base.ratio,r.after.ratio,"%",false]];
  h+=`<div class="card"><div class="simgrid">`;
  M.forEach(([k,b,a,u,lowerBetter])=>{
    const d=a-b, good=lowerBetter?d<0:d>0;
    const pct=b?Math.round((a-b)/b*100):0;
    h+=`<div class="simrow"><span class="sk">${esc(T_[k])}</span>
      <span class="sb">${b}${u}</span><span class="ar">→</span>
      <span class="sa ${good?"good":"bad"}">${a}${u}</span>
      <span class="sd ${good?"good":"bad"}">${pct>0?"+":""}${pct}%</span></div>`;
  });
  h+=`</div></div>`;
  const pg=programme();
  if(pg.done){
    h+=`<div class="card"><h3>${esc(T_.compareTitle)}</h3>`+
      bar([{l:T_.valueDays,v:pg.vad,c:"var(--green)"},{l:T_.waitDays,v:pg.wait,c:"var(--orange)"},
           {l:T_.reworkDays,v:pg.rework,c:"var(--red)"}],"d")+
      `<div class="simgrid"><div class="simrow"><span class="sk">${esc(T_.progDays)}</span>
        <span class="sb">${pg.baseline}d</span><span class="ar">→</span>
        <span class="sa ${pg.actual<=pg.baseline?"good":"bad"}">${pg.actual}d</span>
        <span class="sd ${pg.actual<=pg.baseline?"good":"bad"}">${pg.baseline?Math.round((pg.actual-pg.baseline)/pg.baseline*100):0}%</span></div>
        <div class="simrow"><span class="sk">${esc(T_.progRatio)}</span>
        <span class="sb">—</span><span class="ar">→</span>
        <span class="sa good">${pg.ratio}%</span><span class="sd"></span></div></div></div>`;
  }
  h+=`<div class="card"><h3>${esc(T_.simLevers)} — ${r.applied.length} / ${LEVERS.length}</h3><div class="levers">`;
  LEVERS.forEach(l=>{ const on=r.applied.indexOf(l)>=0;
    h+=`<span class="pill ${on?"high":"low"}">${esc(isAr()?l.ar:l.en)}</span>`; });
  return h+`</div></div>`;
}

/* ---- plan ---- */
function buildPlan(){
  const sc=DIMS.map(d=>({d,s:dimScore(d.id)})).filter(x=>x.s!==null);
  if(!sc.length) return null;
  const weak=sc.slice().sort((a,b)=>a.s-b.s),s=slots(),ar=isAr();
  const pick=(id,b,n)=>(ar?RECS[id][b].ar:RECS[id][b].en).slice(0,n);
  const h30=[],h60=[],h90=[];
  h30.push(ar?`ارسم الحالة الحالية لـ«${s.proc}» على صفحة واحدة مع من ينفّذها، وسجّل زمن الانتظار عند كل مرحلة من ${s.st[0]} إلى ${s.st[3]}.`
             :`Map the current state of "${s.proc}" on one page with the people who run it, recording waiting time at every stage from ${s.st[0].toLowerCase()} to ${s.st[3].toLowerCase()}.`);
  pick(weak[0].d.id,band(weak[0].s),2).forEach(x=>h30.push(x));
  h30.push(ar?`ابدأ بقياس نسبة ${s.unit} المُطلق وكل متطلباته متوفرة — وعلى رأسها ${s.gate[0]}.`
             :`Start measuring the proportion of ${s.unit} released with every prerequisite in place — starting with ${s.gate[0].toLowerCase()}.`);
  pick(weak[1].d.id,band(weak[1].s),2).forEach(x=>h60.push(x));
  h60.push(ar?`ثبّت جولة يومية قصيرة عند موضع العمل تناقش الاستثناءات فقط وتُسنِد مالكاً ووقتاً لكل مشكلة.`
             :`Establish a short daily routine where the work happens, discussing exceptions only and giving every problem an owner and a time.`);
  h60.push(ar?`أعد قياس البعدين الأضعف عند اليوم الستين وقارن بخط الأساس.`
             :`Re-measure your two weakest dimensions at day 60 and compare against the baseline.`);
  pick(weak[2].d.id,band(weak[2].s),1).forEach(x=>h90.push(x));
  h90.push(ar?`وسّع ما نجح إلى عملية ثانية، ووثّق ما لم ينجح ولماذا — فالثاني أثمن.`
             :`Extend what worked to a second process, and document what did not work and why — the second is worth more.`);
  h90.push(ar?`انشر زمن وصول ${s.unit} إلى ${s.cust} كمقياس ثابت على مستوى القيادة.`
             :`Publish the time a ${s.unit} takes to reach ${s.cust} as a standing measure at leadership level.`);
  h90.push(ar?`راجع تعريف القيمة والمقاييس مع الإدارة العليا وثبّت إيقاعاً ربعياً.`
             :`Review the value definition and the measures with senior management, and lock in a quarterly cadence.`);
  return {h30,h60,h90,weak:weak.slice(0,3).map(w=>({id:w.d.id,en:w.d.en,ar:w.d.ar,s:w.s}))};
}

/* ---------------------------------------------------------------- wiring */

  $$("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));

  const ps=$("#pSave");

    ["name","sector","process"].forEach(k=>{const el=$(`[data-p="${k}"]`); if(el&&!el.value){el.classList.add("err");bad=true;}});
    if(bad){ toast(t().pRequired); return; }

    const c=$(".prog b"); if(c) c.textContent=d+" / "+tt; });
  const tr=$("#toRes"); if(tr) tr.onclick=()=>{ if(answeredCount()<totalQ()){toast(t().aIncomplete);return;} go("results"); };
  $$("[data-act]").forEach(el=>el.oninput=()=>{ S.actNotes["a"+el.dataset.act]=el.value; save(); });
  $$("[data-done]").forEach(el=>el.onchange=()=>{ S.actDone["a"+el.dataset.done]=el.checked; save();
    const c=el.closest(".act"); if(c) c.classList.toggle("done",el.checked); });
  $$("[data-genact]").forEach(b=>b.onclick=()=>{ S.adapt["a"+b.dataset.genact]=adaptAct(+b.dataset.genact); save(); render(); toast(t().adapted); });
  $$("[data-genmod]").forEach(b=>b.onclick=()=>{ S.adapt["m"+b.dataset.genmod]=adaptMod(b.dataset.genmod); save(); render(); toast(t().adapted); });
  $$("[data-t]").forEach(el=>el.oninput=()=>{ const id=el.dataset.t,tp=TMPLS.find(x=>x.id===id);

    if(TCOMPUTE[id]) render(); });
  $$("[data-dtab]").forEach(b=>b.onclick=()=>{ S.drillOpen=b.dataset.dtab; save(); render(); });
  $$("[data-dq]").forEach(b=>b.onclick=()=>{ const p=b.dataset.dq.split(":");
    drillState(p[0]).a[+p[1]]=+p[2]; save(); render(); });
  const dc=$("#drillCheck"); if(dc) dc.onclick=()=>{ drillState(S.drillOpen).shown=true; save(); render(); };
  const dr=$("#drillReset"); if(dr) dr.onclick=()=>{ S.drill[S.drillOpen]={a:{},shown:false}; save(); render(); };
  $$("[data-addr]").forEach(b=>b.onclick=()=>{ const tp=TMPLS.find(x=>x.id===b.dataset.addr);
    tmplRows(tp).push(Array((isAr()?tp.cols.ar:tp.cols.en).length).fill("")); save(); render(); });
  $$("[data-delr]").forEach(b=>b.onclick=()=>{ const tp=TMPLS.find(x=>x.id===b.dataset.delr); const r=tmplRows(tp);
    if(r.length>1) r.splice(+b.dataset.ri,1); save(); render(); });

    const r=new FileReader(); r.onload=()=>{ try{ S=Object.assign(S,JSON.parse(r.result)); save(); render(); toast(t().saved);}catch(x){toast("✕");} }; r.readAsText(f); };
  const rs=$("#doReset"); if(rs) rs.onclick=()=>{ if(!confirm(t().resetConfirm)) return;

/* ---- practice drills ---- */
function vDrill(){
  const T_=t();
  let h=head(T_.drillTitle,T_.drillLead);
  h+=`<div class="daytabs">`+DRILLS.map(d=>{
    const sc=drillScore(d);
    return `<button class="dt ${S.drillOpen===d.k?"on":""}" data-dtab="${d.k}">${esc(isAr()?d.ar:d.en)}
      ${sc.ans===sc.total?`<i class="tick">✓</i>`:""}</button>`; }).join("")+`</div>`;
  const d=DRILLS.find(x=>x.k===S.drillOpen)||DRILLS[0];
  const st=drillState(d.k), sc=drillScore(d);
  const m=MODULES.find(x=>x.code===d.mod), a=ACTS.find(x=>x.n===d.act);
  h+=`<div class="card"><h3>${esc(isAr()?d.ar:d.en)}</h3><p class="muted">${esc(L(d.lead))}</p>`;
  h+=refBar([{doc:T_.manual,pg:m.pg,lbl:T_.module+" "+m.code},{doc:T_.workbook,pg:a.pg,lbl:"A"+a.n}]);
  h+=`<div class="scorebar"><span>${esc(T_.drillScore)}</span>
    <b class="${sc.pct>=70?"good":"bad"}">${sc.ok} / ${sc.total}</b>
    <div class="tb"><i style="width:${(sc.ans/sc.total*100).toFixed(0)}%"></i></div></div></div>`;
  d.q.forEach((q,i)=>{
    const pick=st.a[i], shown=st.shown&&pick!==undefined;
    h+=`<div class="card drillq ${shown?(pick===q.a?"right":"wrong"):""}">
      <p class="qtext"><b>${i+1}.</b> ${esc(isAr()?q.ar:q.en)}</p><div class="opts">`;
    (isAr()?d.opts.ar:d.opts.en).forEach((o,oi)=>{
      const cls=[pick===oi?"sel":""];
      if(shown&&oi===q.a) cls.push("ans");
      if(shown&&pick===oi&&pick!==q.a) cls.push("bad");
      h+=`<button class="opt ${cls.join(" ")}" data-dq="${d.k}:${i}:${oi}">${esc(o)}</button>`;
    });
    h+=`</div>`;
    if(shown) h+=`<div class="whybox"><b>${esc(pick===q.a?T_.drillCorrect:T_.drillWrong)}</b> — ${esc(L(q.why))}</div>`;
    h+=`</div>`;
  });
  h+=`<div class="row wrap end"><button class="btn ghost" id="drillReset">${esc(T_.drillReset)}</button>
    <button class="btn primary" id="drillCheck">${esc(T_.drillCheck)}</button></div>`;
  return h;
}

/* ---------------------------------------------------------------- export */
function reportModel(){
  const T_=t(),p=S.profile,ov=overall(),ds=doneSet(),pg=programme();
  const sec=SECTORS.find(x=>x.k===p.sector);
  const who=p.part||p.name||T_.brand;
  const R=[{t:"h1",v:T_.reportFor},
           {t:"p",v:T_.reportOwner+": "+who+(p.partRole?" · "+p.partRole:"")},
           {t:"p",v:(p.name||"")+(sec?" · "+(isAr()?sec.ar:sec.en):"")+" · "+new Date().toISOString().slice(0,10)}];

  /* dashboard */
  R.push({t:"h2",v:T_.progTitle});
  R.push({t:"kpi",items:[
    {k:T_.rOverall,v:ov!==null?ov.toFixed(1):"—"},
    {k:T_.progStages,v:pg.done+"/"+pg.total},
    {k:T_.progDays,v:String(pg.actual)},
    {k:T_.progRatio,v:pg.ratio+"%",c:"1F9D6B"},
    {k:T_.nav.act,v:ds.size+"/"+ACTS.length}]});

  if(ov!==null){
    R.push({t:"h2",v:T_.oScore},{t:"p",v:ov.toFixed(1)+" / 5.0 — "+T_.levels[levelOf(ov)].n},
           {t:"p",v:T_.levels[levelOf(ov)].d});
    R.push({t:"chart",unit:"",items:DIMS.map(d=>({k:isAr()?d.ar:d.en,v:+(dimScore(d.id)||0).toFixed(1),
      c:band(dimScore(d.id)||0)==="low"?"E06C0A":(band(dimScore(d.id)||0)==="mid"?"71C0E4":"1F9D6B")}))});
    const sorted=DIMS.map(d=>({d,s:dimScore(d.id)})).filter(x=>x.s!==null).sort((a,b)=>a.s-b.s);
    R.push({t:"h2",v:T_.rRecs});
    sorted.forEach(({d,s})=>{ R.push({t:"p",v:"▸ "+(isAr()?d.ar:d.en)+" ("+s.toFixed(1)+")"});
      (isAr()?RECS[d.id][band(s)].ar:RECS[d.id][band(s)].en).forEach(x=>R.push({t:"p",v:"   • "+x})); });
  }

  /* programme */
  if(pg.done){
    R.push({t:"h2",v:T_.buildTitle});
    R.push({t:"kpi",items:[{k:T_.valueDays,v:String(pg.vad),c:"1F9D6B"},
      {k:T_.waitDays,v:String(pg.wait),c:"E06C0A"},{k:T_.reworkDays,v:String(pg.rework),c:"C0392B"},
      {k:T_.totalDays,v:String(pg.actual)},{k:T_.savedDays,v:String(pg.saved),c:"1F9D6B"}]});
    R.push({t:"tbl",rows:[[T_.phase,T_.dept,T_.valueDays,T_.waitDays,T_.reworkDays,T_.totalDays]]
      .concat(pg.rows.filter(x=>x.st==="done").map(x=>{
        const dd=DEPTS.find(y=>y.k===x.s.dept);
        return [x.s.id+" "+(isAr()?x.s.ar:x.s.en),(isAr()?dd.ar:dd.en),
                String(x.r.vad),String(x.r.wait),String(x.r.rework),String(x.r.total)];}))});
    R.push({t:"h2",v:T_.wasteTitle},{t:"p",v:T_.wasteLead});
    R.push({t:"chart",unit:"d",items:wasteBreakdown().filter(x=>x.v>0)
      .map(x=>({k:isAr()?x.ar:x.en,v:x.v,c:"E06C0A"}))});
    if(pg.earlies.length){
      R.push({t:"h2",v:T_.progEarly});
      R.push({t:"tbl",rows:[[T_.buildTitle,T_.gate,T_.reworkDays]]
        .concat(pg.earlies.map(x=>[x.s.id+" "+(isAr()?x.s.ar:x.s.en),
          (x.s.gate.length-gateGranted(x.s))+" / "+x.s.gate.length,String(x.r.rework)]))});
    }
    if(pg.gaps.length){
      R.push({t:"h2",v:T_.gapTitle},{t:"p",v:T_.gapLead});
      R.push({t:"tbl",rows:[[T_.buildTitle,T_.stNone,T_.gate]]
        .concat(pg.gaps.map(x=>{ const miss=x.s.gate.filter((g,i)=>!stRec(x.s.id).ok[i]);
          return [x.s.id+" "+(isAr()?x.s.ar:x.s.en),
                  T_["st"+(x.st?x.st[0].toUpperCase()+x.st.slice(1):"None")]||T_.stNone,
                  miss.map(m=>isAr()?m.ar:m.en).join(" · ")||"—"]; }))});
    }
  }

  if(ov!==null&&ds.size){
    const r=simulate(ds,ov);
    R.push({t:"h2",v:T_.simTitle});
    R.push({t:"tbl",rows:[[isAr()?"المقياس":"Measure",T_.simBefore,T_.simAfter],
      [T_.mLead,String(r.base.lead),String(r.after.lead)],[T_.mReady,r.base.ready+"%",r.after.ready+"%"],
      [T_.mStop,String(r.base.stop),String(r.after.stop)],[T_.mRework,String(r.base.rework),String(r.after.rework)],
      [T_.mRatio,r.base.ratio+"%",r.after.ratio+"%"]]});
  }

  const notes=allActs().filter(a=>(S.actNotes["a"+a.n]||"").trim());
  if(notes.length){ R.push({t:"h2",v:T_.oWork+" — "+ds.size+"/"+ACTS.length});
    notes.forEach(a=>{ R.push({t:"p",v:"▸ "+a.n+". "+(isAr()?a.ar:a.en)+(a.pg?"  ("+T_.workbook+" "+T_.page+a.pg+")":"")});
      R.push({t:"p",v:S.actNotes["a"+a.n]}); }); }

  const filled=TMPLS.filter(tp=>(S.tmplData["t_"+tp.id]||[]).some(r=>r.some(c=>(c||"").trim())));
  if(filled.length){ R.push({t:"h2",v:T_.oTmpl+" — "+filled.length+"/"+TMPLS.length});
    filled.forEach(tp=>{ R.push({t:"p",v:tp.id+" · "+(isAr()?tp.ar:tp.en)+"  ("+T_.workbook+" "+T_.page+tp.pg+")"});
      const rows=S.tmplData["t_"+tp.id].filter(r=>r.some(c=>(c||"").trim()));
      if(rows.length) R.push({t:"tbl",rows:[tCols(tp)].concat(rows)}); }); }

  if(S.plan){ R.push({t:"h2",v:T_.oPlan});
    [[T_.plan30,S.plan.h30,"h30"],[T_.plan60,S.plan.h60,"h60"],[T_.plan90,S.plan.h90,"h90"]].forEach(([ti,items,id])=>{
      R.push({t:"p",v:"▸ "+ti});
      items.forEach((x,i)=>{ const o=S.profile["pl_"+id+i+"o"],m=S.profile["pl_"+id+i+"m"];
        R.push({t:"p",v:"   • "+x+(o?"  — "+T_.planOwner+": "+o:"")+(m?"  — "+m:"")}); }); }); }

  R.push({t:"h2",v:" "},{t:"p",v:T_.reportOwner+": "+who},{t:"p",v:T_.author+" · "+T_.centre});
  return R;
}
function deckModel(){
  const T_=t(),p=S.profile,ov=overall(),ds=doneSet(),pg=programme();
  const sec=SECTORS.find(x=>x.k===p.sector);
  const who=p.part||p.name||T_.brand;
  const owner=who+(p.partRole?" · "+p.partRole:"")+(p.name?" · "+p.name:"");
  const date=new Date().toISOString().slice(0,10);
  const D=[];

  D.push({kind:"cover",kick:T_.centre,title:T_.reportFor,
    sub:(p.name||"")+(sec?" · "+(isAr()?sec.ar:sec.en):""),
    meta:[{k:T_.reportOwner,v:who},{k:T_.pPartRole,v:p.partRole||"—"},{k:"Date",v:date}]});

  const toc=[];
  if(ov!==null) toc.push(T_.rTitle, T_.rBy, T_.rRecs);
  if(pg.done) toc.push(T_.progTitle, T_.valueVsWaste, T_.wasteTitle);
  if(pg.gaps.length) toc.push(T_.gapTitle);
  if(ov!==null&&ds.size) toc.push(T_.simTitle);
  toc.push(T_.dashProg);
  if(S.plan) toc.push(T_.plan30,T_.plan60,T_.plan90);
  D.push({title:T_.contents,sub:owner,toc:toc,owner:owner});

  /* infographic dashboard */
  D.push({title:T_.progTitle,sub:(p.name||"")+" · "+date,owner:owner,
    kpi:[{k:T_.rOverall,v:ov!==null?ov.toFixed(1):"—",sub:"/ 5.0",dark:true},
         {k:T_.progStages,v:pg.done+"/"+pg.total,c:"12313E"},
         {k:T_.progDays,v:String(pg.actual),sub:isAr()?"يوم":"days",c:"12313E"},
         {k:T_.progRatio,v:pg.ratio+"%",c:"1F9D6B"},
         {k:T_.nav.act,v:ds.size+"/"+ACTS.length,c:"54B4DE"}],
    stack: pg.done?[{k:T_.valueDays,v:pg.vad,c:"1F9D6B"},{k:T_.waitDays,v:pg.wait,c:"E06C0A"},
                    {k:T_.reworkDays,v:pg.rework,c:"C0392B"}]:null});

  if(ov!==null){
    const lv=levelOf(ov);
    D.push({title:T_.rTitle,sub:T_.levels[lv].d,owner:owner,
      kpi:[{k:T_.rLevel,v:String(lv+1),sub:T_.levels[lv].n,dark:true},
           {k:T_.rOverall,v:ov.toFixed(1),sub:"/ 5.0",c:"12313E"},
           {k:T_.progEarly,v:String(pg.earlies.length),c:"E06C0A"},
           {k:T_.nav.tmpl,v:tmplFilledCount()+"/"+TMPLS.length,c:"54B4DE"}]});
    D.push({title:T_.rBy,sub:T_.rBench+" / 5.0",owner:owner,unit:"",
      chart:DIMS.map(d=>({k:isAr()?d.ar:d.en,v:+(dimScore(d.id)||0).toFixed(1),
        c:band(dimScore(d.id)||0)==="low"?"E06C0A":(band(dimScore(d.id)||0)==="mid"?"54B4DE":"1F9D6B")}))});
    const worst=DIMS.map(d=>({d,s:dimScore(d.id)})).filter(x=>x.s!==null).sort((a,b)=>a.s-b.s)[0];
    if(worst) D.push({title:T_.rRecs,sub:(isAr()?worst.d.ar:worst.d.en)+" · "+worst.s.toFixed(1),owner:owner,
      bullets:(isAr()?RECS[worst.d.id][band(worst.s)].ar:RECS[worst.d.id][band(worst.s)].en)});
  }

  if(pg.done){
    D.push({title:T_.valueVsWaste,sub:T_.buildTitle,owner:owner,unit:"d",
      chart:[{k:T_.valueDays,v:pg.vad,c:"1F9D6B"},{k:T_.waitDays,v:pg.wait,c:"E06C0A"},
             {k:T_.reworkDays,v:pg.rework,c:"C0392B"},{k:T_.totalDays,v:pg.actual,c:"12313E"},
             {k:T_.savedDays,v:pg.saved,c:"54B4DE"}]});
    D.push({title:T_.wasteTitle,sub:T_.wasteLead,owner:owner,unit:"d",
      chart:wasteBreakdown().filter(x=>x.v>0).slice(0,8).map(x=>({k:isAr()?x.ar:x.en,v:x.v,c:"E06C0A"}))});
    const rows=pg.rows.filter(x=>x.st==="done").slice(0,12).map(x=>{
      const dd=DEPTS.find(y=>y.k===x.s.dept);
      return [x.s.id,(isAr()?x.s.ar:x.s.en).slice(0,30),(isAr()?dd.ar:dd.en).slice(0,22),
              String(x.r.vad),String(x.r.wait),String(x.r.total)];});
    D.push({title:T_.buildTitle,sub:T_.progStages+": "+pg.done+" / "+pg.total,owner:owner,
      table:[[T_.docNo,T_.buildTitle,T_.dept,T_.valueDays,T_.waitDays,T_.totalDays]].concat(rows)});
    if(pg.gaps.length) D.push({title:T_.gapTitle,sub:T_.gapLead,owner:owner,
      bullets:pg.gaps.slice(0,7).map(x=>x.s.id+" · "+(isAr()?x.s.ar:x.s.en))});
  }

  if(ov!==null&&ds.size){
    const r=simulate(ds,ov);
    D.push({title:T_.simTitle,sub:T_.simLevers+": "+r.applied.length+" / "+LEVERS.length,owner:owner,
      kpi:[{k:T_.mLead,v:r.base.lead+" → "+r.after.lead,c:"1F9D6B"},
           {k:T_.mReady,v:r.base.ready+"% → "+r.after.ready+"%",c:"1F9D6B"},
           {k:T_.mStop,v:r.base.stop+" → "+r.after.stop,c:"1F9D6B"},
           {k:T_.mRework,v:r.base.rework+" → "+r.after.rework,c:"1F9D6B"}]});
  }

  D.push({title:T_.dashProg,owner:owner,unit:"",
    chart:[1,2,3,4].map(d=>{ const as=ACTS.filter(a=>a.day===d),dn=as.filter(a=>ds.has(a.n)).length;
      return {k:T_.day+" "+d,v:dn,c:dn===as.length?"1F9D6B":"54B4DE"}; })});

  if(S.plan){
    [[T_.plan30,S.plan.h30,"h30"],[T_.plan60,S.plan.h60,"h60"],[T_.plan90,S.plan.h90,"h90"]].forEach(([ti,items,hid])=>{
      D.push({title:ti,sub:T_.planLead,owner:owner,
        bullets:items.slice(0,5).map((x,i)=>{ const o=S.profile["pl_"+hid+i+"o"];
          return x+(o?"  —  "+T_.planOwner+": "+o:""); })});
    });
  }

  D.push({kind:"cover",kick:T_.centre,title:who,sub:owner,
    meta:[{k:T_.reportOwner,v:who},{k:"",v:T_.author}]});
  return D;
}

/* ---------------------------------------------------------------- chrome */
function buildNav(){
  const T_=t();
  $("#nav").innerHTML=NAVGRP.map(g=>
    `<div class="navgrp">${esc(T_[g.g])}</div>`+
    g.items.map(([v,ic])=>{
      const n=(v==="inbox")?inboxCount():0;
      return `<button class="nav-item ${v===view?"on":""}" data-v="${v}">
        <span class="ni">${ic}</span>${esc(T_.nav[v])}${n?`<span class="nb">${n}</span>`:""}</button>`;
    }).join("")).join("");
  $$(".nav-item").forEach(b=>b.onclick=()=>{ go(b.dataset.v); $(".side").classList.remove("open"); });
  $("#roleLbl").textContent=T_.yourRole;
  $("#roleSel").innerHTML=ROLES.map(r=>
    `<option value="${r.k}" ${S.role===r.k?"selected":""}>${esc(isAr()?r.ar:r.en)}</option>`).join("");
  $("#crumbMod").textContent=T_.nav[view]||"";
  const sec=SECTORS.find(x=>x.k===S.profile.sector);
  $("#crumbOrg").textContent=(S.profile.name||T_.brand)+(sec?" · "+(isAr()?sec.ar:sec.en):"");
  $("#inboxN").textContent=inboxCount();
  $("#langBtn").textContent=isAr()?"EN":"ع";
  $("#heroTitle").textContent=T_.heroTitle; $("#heroLead").textContent=T_.heroLead;
  $("#startBtn").textContent=T_.start; $("#centre").textContent=T_.centre;
  $("#author").textContent=T_.author; $("#stat").textContent=T_.stat;
  $("#sideAuthor").textContent=T_.author; $("#sideCentre").textContent=T_.centre;
  $("#footAuthor").textContent=T_.author; $("#footCentre").textContent=T_.centre;
}
function init(){
  load();
  $("#langBtn").onclick=()=>{ S.lang=isAr()?"en":"ar"; save(); render(); };
  $("#roleSel").onchange=e=>{ S.role=e.target.value; save(); render(); };
  $("#burger").onclick=()=>$(".side").classList.toggle("open");
  $("#inboxBtn").onclick=()=>go("inbox");
  $("#startBtn").onclick=()=>{ $("#hero").classList.add("hide"); $("#app").classList.add("show"); go("dash"); };
  render();
  if(S.profile.name){ $("#hero").classList.add("hide"); $("#app").classList.add("show"); }
}
document.addEventListener("DOMContentLoaded",init);
</script>
