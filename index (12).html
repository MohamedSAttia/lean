<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lean OS · Lean Business Management System · SOMU</title>
<meta name="description" content="Integrated bilingual Lean management system for naval shipbuilding: maturity assessment, 13 modules, 30 activities, 30 templates, a 17-stage newbuild programme with departmental approvals, a Lean toolbox with engineering calculators, and Word/PowerPoint reporting.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   LEAN OS — application shell (ERP layout)
   ========================================================================== */
:root{
  --ink:#12313E; --ink2:#1B4A5E; --sky:#54B4DE; --sky2:#8FD3EE; --orange:#E06C0A;
  --green:#1F9D6B; --indigo:#2E3192; --red:#C0392B;
  --tint:#F2F8FB; --tint2:#E4F0F6; --line:#D3E3EB; --line2:#BFD6E1;
  --sand:#FDF4E9; --paper:#F7FAFC; --card:#FFFFFF;
  --txt:#12313E; --soft:#4B6675; --muted:#7D96A3;
  --r:12px; --sh:0 1px 1px rgba(18,49,62,.04),0 6px 18px rgba(18,49,62,.06);
  --side:236px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--txt);background:var(--paper);line-height:1.58;-webkit-font-smoothing:antialiased;font-size:15px;
}
html[dir="rtl"] body{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3,h4{margin:0 0 .4rem;line-height:1.24;letter-spacing:-.016em;font-weight:600}
p{margin:0 0 .6rem}
ul,ol{margin:.2rem 0 .6rem;padding-inline-start:1.15rem}
li{margin:.24rem 0}
.muted,em.muted{color:var(--muted)}
.hide{display:none!important}
.somulogo{display:block;height:100%;width:auto;object-fit:contain}

/* ---------- hero ---------- */
#hero{min-height:100vh;display:grid;place-items:center;padding:2rem 1.4rem;
  background:radial-gradient(1100px 600px at 50% -10%,#E9F4F9 0%,var(--paper) 62%)}
.herobox{max-width:660px;text-align:center}
.herologo{display:flex;justify-content:center;margin-bottom:1.6rem}
.herologo .somulogo{height:52px}
#hero .kick{font-size:.72rem;font-weight:600;letter-spacing:.2em;color:var(--sky);text-transform:uppercase}
#heroTitle{font-size:clamp(1.8rem,4.6vw,2.8rem);margin:1rem 0 .8rem;letter-spacing:-.035em;font-weight:600}
#heroLead{font-size:1.02rem;color:var(--soft);margin:0 auto 1.9rem}
.btn.lg{padding:.72rem 1.8rem;font-size:.95rem}
.herostat{margin-top:1.4rem;font-size:.78rem;color:var(--sky);font-weight:600;letter-spacing:.04em}
.heroft{margin-top:1.9rem;font-size:.82rem;color:var(--muted)}
.heroft b{display:block;color:var(--ink);font-weight:600}
#app{display:none}
#app.show{display:flex;min-height:100vh}

/* ---------- sidebar ---------- */
.side{
  width:var(--side);flex:none;background:var(--ink);color:#CBE2EC;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto
}
.sidetop{padding:1.1rem 1rem .8rem;border-bottom:1px solid rgba(255,255,255,.09)}
.sidelogo{background:#fff;border-radius:8px;padding:.45rem .6rem;display:flex;justify-content:center}
.sidelogo .somulogo{height:26px}
.rolebox{padding:.8rem 1rem;border-bottom:1px solid rgba(255,255,255,.09)}
.rolebox label{display:block;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;
  color:#7FA7B8;margin-bottom:.3rem;font-weight:600}
.rolebox select{
  width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
  color:#fff;border-radius:8px;padding:.4rem .55rem;font:inherit;font-size:.82rem;outline:none
}
.rolebox select option{color:#12313E}
#nav{flex:1;padding:.7rem .55rem}
.navgrp{font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:#6D96A8;
  padding:.75rem .6rem .3rem;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:.55rem;width:100%;border:0;background:none;font:inherit;
  font-size:.85rem;color:#CBE2EC;padding:.46rem .6rem;border-radius:8px;cursor:pointer;text-align:start
}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.on{background:var(--sky);color:#08222D;font-weight:600}
.nav-item .ni{width:16px;flex:none;text-align:center;font-size:.9rem;opacity:.85}
.nav-item.on .ni{opacity:1}
.nav-item .nb{margin-inline-start:auto;background:var(--orange);color:#fff;border-radius:99px;
  font-size:.66rem;font-weight:600;padding:.02rem .38rem}
.sidefoot{padding:.9rem 1rem;border-top:1px solid rgba(255,255,255,.09);font-size:.7rem;color:#7FA7B8}
.sidefoot b{display:block;color:#E3F0F6;font-weight:600;font-size:.75rem}

/* ---------- main ---------- */
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:.7rem;
  padding:.6rem 1.3rem;background:rgba(247,250,252,.93);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.burger{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:.28rem .55rem;font-size:1rem;cursor:pointer;color:var(--ink)}
.crumb{min-width:0}
.crumb span{display:block;font-weight:600;font-size:.92rem;letter-spacing:-.01em}
.crumb em{display:block;font-style:normal;font-size:.74rem;color:var(--muted)}
.spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;
  padding:.34rem .62rem;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;position:relative}
.iconbtn:hover{border-color:var(--sky)}
.iconbtn.badge::before{content:"✉";margin-inline-end:.3rem}
.iconbtn.badge span{background:var(--orange);color:#fff;border-radius:99px;padding:.02rem .34rem;font-size:.68rem}
main{flex:1;padding:1.5rem 1.3rem 4rem;max-width:1180px;width:100%}
.foot{border-top:1px solid var(--line);background:#fff;padding:1.3rem;text-align:center}
.footlogo{display:flex;justify-content:center;margin-bottom:.6rem}
.footlogo .somulogo{height:22px;opacity:.7}
.foot b{display:block;color:var(--ink);font-size:.86rem;font-weight:600}
.foot span{font-size:.76rem;color:var(--muted)}
@media(max-width:900px){
  .side{position:fixed;inset-inline-start:-260px;z-index:60;transition:.22s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .side.open{inset-inline-start:0}
  .burger{display:block}
  main{padding:1.1rem .9rem 3rem}
}

/* ---------- shared ---------- */
.vhead{margin:.1rem 0 1.15rem}
.vhead h1{font-size:clamp(1.3rem,2.6vw,1.72rem)}
.vhead p{color:var(--soft);max-width:76ch;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:1.05rem 1.15rem;margin-bottom:.9rem;box-shadow:var(--sh)}
.card h3{font-size:1rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.grid2.tight{gap:.5rem}
.grid2.gap{margin-top:.9rem}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:.5rem;align-items:center;margin-top:.8rem}
.row.end{justify-content:flex-end}
.row.wrap{flex-wrap:wrap}
/* ---------- forms ---------- */
.fld{display:block;margin-bottom:.7rem}
.fld span{display:block;font-size:.78rem;font-weight:700;color:var(--soft);margin-bottom:.28rem}
.fld input,.fld select,.fld textarea{
  width:100%;font:inherit;font-size:.92rem;color:var(--txt);background:var(--paper);
  border:1px solid var(--line);border-radius:9px;padding:.52rem .68rem;outline:none
}
.fld textarea{resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--sky);background:#fff;box-shadow:0 0 0 3px rgba(113,192,228,.18)}
.fld input.err,.fld select.err{border-color:var(--orange);background:var(--sand)}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;
  padding:.55rem .95rem;font:inherit;font-size:.88rem;font-weight:700;cursor:pointer
}
.btn:hover{border-color:var(--sky)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:var(--ink2)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:#E8C4BE}
.btn.tiny{padding:.34rem .66rem;font-size:.79rem}
.btn.file{display:inline-flex;align-items:center;cursor:pointer}

/* ---------- assessment ---------- */
.prog{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem;font-size:.84rem;color:var(--soft)}
.prog .bar{flex:1;height:7px;background:var(--tint2);border-radius:99px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--sky);transition:width .25s}
.dimhead{display:flex;gap:.75rem;align-items:flex-start;margin-bottom:.9rem;
  padding-bottom:.75rem;border-bottom:1px solid var(--tint2)}
.dimhead h3{margin:0}
.dimhead p{margin:.1rem 0 0;font-size:.85rem;color:var(--muted)}
.ic{
  width:38px;height:38px;flex:none;border-radius:11px;background:var(--tint);
  color:var(--ink);display:grid;place-items:center;font-size:1.1rem;font-weight:700
}
.ic.sm{width:26px;height:26px;font-size:.85rem;border-radius:8px}
.q{padding:.6rem 0;border-bottom:1px dashed var(--tint2)}
.q:last-child{border:0;padding-bottom:0}
.q p{margin:0 0 .45rem;font-size:.93rem}
.scale{display:flex;gap:.32rem;align-items:center;flex-wrap:wrap}
.sc{
  width:36px;height:34px;border:1px solid var(--line);background:#fff;border-radius:9px;
  font:inherit;font-weight:700;font-size:.85rem;color:var(--soft);cursor:pointer
}
.sc:hover{border-color:var(--sky)}
.sc.on{background:var(--ink);border-color:var(--ink);color:#fff}
.sclab{font-size:.78rem;color:var(--muted);margin-inline-start:.35rem}

/* ---------- results ---------- */
.hero-res{display:flex;gap:1.4rem;align-items:center;flex-wrap:wrap}
.score{display:flex;align-items:baseline;gap:.3rem}
.score .num{font-size:3.1rem;font-weight:700;letter-spacing:-.04em;color:var(--ink);line-height:1}
.score .of{font-size:1rem;color:var(--muted)}
.lvl{flex:1;min-width:240px}
.tag{
  display:inline-block;padding:.28rem .7rem;border-radius:99px;font-size:.8rem;font-weight:700;
  color:#fff;margin-bottom:.4rem
}
.lv0{background:var(--red)}.lv1{background:var(--orange)}.lv2{background:var(--sky);color:var(--ink)}
.lv3{background:var(--green)}.lv4{background:var(--indigo)}
.lvl p{margin:0;color:var(--soft);font-size:.92rem}
.bars{margin:.5rem 0}
.brow{display:grid;grid-template-columns:minmax(140px,1.4fr) 3fr auto;gap:.6rem;align-items:center;margin:.42rem 0}
.bl{font-size:.86rem}
.bt{height:9px;background:var(--tint2);border-radius:99px;overflow:hidden}
.bt i{display:block;height:100%;border-radius:99px}
.b-low,.blow{background:var(--orange)} .bmid{background:var(--sky)} .bhigh{background:var(--green)}
.brow b{font-size:.86rem;min-width:2ch;text-align:end}
.mini{border-radius:11px;padding:.7rem .85rem;font-size:.85rem}
.mini span{display:block;color:var(--muted);font-size:.76rem;font-weight:700}
.mini.good{background:#EAF6F0} .mini.warn{background:var(--sand)}
.rec{border-top:1px solid var(--tint2);padding-top:.8rem;margin-top:.8rem}
.rec:first-of-type{border:0;padding-top:0;margin-top:.4rem}
.rh{display:flex;align-items:center;gap:.5rem;margin-bottom:.35rem;flex-wrap:wrap}
.pill{padding:.14rem .55rem;border-radius:99px;font-size:.75rem;font-weight:700;background:var(--tint2)}
.pill.low{background:var(--sand);color:var(--orange)}
.pill.mid{background:var(--tint2);color:var(--ink2)}
.pill.high{background:#EAF6F0;color:var(--green)}
.rec ul{margin:0;font-size:.9rem;color:var(--soft)}

/* ---------- learn / act ---------- */
.modhead,.acthead,.tmplhead{display:flex;gap:.7rem;align-items:center;margin-bottom:.7rem}
.code{background:var(--ink);color:#fff;border-radius:8px;padding:.2rem .55rem;font-size:.8rem;font-weight:700}
.acthead .n{
  width:34px;height:34px;flex:none;border-radius:50%;background:var(--orange);color:#fff;
  display:grid;place-items:center;font-weight:700
}
.acthead h3,.modhead h3,.tmplhead h3{margin:0;font-size:1.02rem}
.meta{display:flex;gap:.7rem;font-size:.76rem;color:var(--muted);margin-top:.1rem}
.blk{margin-top:.85rem;padding-top:.7rem;border-top:1px solid var(--tint2)}
.blk h4{font-size:.76rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.blk p,.blk li{font-size:.92rem}
.blk.ship{background:var(--tint);border-radius:11px;padding:.75rem .9rem;border-top:0}
.blk.yours{background:var(--tint2);border-radius:11px;padding:.75rem .9rem;border-top:0}
.blk.trap{background:var(--sand);border-radius:11px;padding:.75rem .9rem;border-top:0}
.blk.trap h4{color:var(--orange)}
.blk.worked{background:#FDF6EC;border-radius:11px;padding:.75rem .9rem;border-top:0}
.blk.worked h4{color:var(--orange)}
.blk.turn{background:var(--ink);color:#D9E9F1;border-radius:11px;padding:.75rem .9rem;border-top:0}
.blk.turn h4{color:var(--sky)}
.blk.turn .out{margin:.5rem 0 0;font-size:.85rem;color:#fff}
.lead{font-size:.95rem}
.gen{font-size:.92rem;min-height:1.2rem;margin-bottom:.5rem}

/* ---------- templates ---------- */
.tblwrap{overflow-x:auto;margin:.3rem 0 .2rem}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{border:1px solid var(--line);padding:.32rem .45rem;text-align:start;vertical-align:top}
thead th{background:var(--ink);color:#fff;font-weight:700;font-size:.78rem;white-space:nowrap}
td input{width:100%;min-width:90px;border:0;background:transparent;font:inherit;font-size:.85rem;color:var(--txt);outline:none}
td input:focus{background:var(--tint)}
th.x,td.x{width:30px;border:0;background:none}
.del{border:0;background:none;color:var(--muted);font-size:1.05rem;cursor:pointer;line-height:1}
.del:hover{color:var(--red)}

/* ---------- plan ---------- */
.weak{display:flex;gap:.4rem;flex-wrap:wrap}
.horizon h3{padding-inline-start:.6rem;border-inline-start:4px solid var(--sky)}
.horizon.h60 h3{border-color:var(--orange)}
.horizon.h90 h3{border-color:var(--green)}
.acts{padding-inline-start:1.2rem}
.acts li{margin:.7rem 0}
.acts li p{margin:0 0 .35rem;font-size:.93rem}

/* ---------- report ---------- */
.report h4{margin-top:.9rem;font-size:.9rem}
table.kv{width:auto;min-width:min(100%,520px)}
table.kv th{background:var(--tint);color:var(--ink);white-space:normal;width:34%}
.big{font-size:1.4rem;font-weight:700;color:var(--ink)}
.note{border-top:1px solid var(--tint2);padding-top:.6rem;margin-top:.6rem}
.note:first-of-type{border:0;padding-top:0;margin-top:.3rem}
.note p{font-size:.9rem;color:var(--soft);margin:.2rem 0 0}
.hint{font-size:.82rem;background:var(--sand);border-radius:9px;padding:.5rem .7rem;color:var(--ink)}

/* ---------- modal / toast ---------- */
#aiModal{position:fixed;inset:0;background:rgba(22,58,73,.42);display:none;place-items:center;z-index:60;padding:1rem}
#aiModal.open{display:grid}
.modal{background:#fff;border-radius:var(--r);padding:1.3rem;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(22,58,73,.25)}
#toast{
  position:fixed;inset-inline:0;bottom:1.4rem;margin:0 auto;width:max-content;max-width:90vw;
  background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:99px;font-size:.87rem;
  opacity:0;transform:translateY(8px);transition:.22s;pointer-events:none;z-index:80
}
#toast.show{opacity:1;transform:none}

/* ---------- footer ---------- */
.foot{border-top:1px solid var(--line);background:#fff;padding:1.6rem 1.2rem;text-align:center}
.foot b{display:block;color:var(--ink);font-size:.92rem}
.foot span{font-size:.79rem;color:var(--muted)}

/* ---------- print ---------- */
@media print{
  .top,.navwrap,#hero,.row,.btn,.del,th.x,td.x,#toast,#aiModal{display:none!important}
  body{background:#fff}
  main{max-width:none;padding:0}
  .card{box-shadow:none;break-inside:avoid;page-break-inside:avoid;border-color:#ccc}
  .blk.turn{background:#fff;color:#000;border:1px solid #ccc}
  .blk.turn h4{color:#000}
  td input{border-bottom:1px solid #ddd}
}

/* ---------- v2 additions ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;margin-bottom:1rem}
@media(max-width:760px){.tiles{grid-template-columns:1fr 1fr}}
.tile{
  background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:.85rem .95rem;
  text-align:start;cursor:pointer;font:inherit;color:var(--txt);box-shadow:var(--sh)
}
.tile:hover{border-color:var(--sky)}
.tile .tl{display:block;font-size:.76rem;font-weight:700;color:var(--muted)}
.tile b{display:block;font-size:1.4rem;font-weight:700;letter-spacing:-.025em;margin:.15rem 0 .4rem}
.tb{height:6px;background:var(--tint2);border-radius:99px;overflow:hidden}
.tb i{display:block;height:100%;background:var(--sky);border-radius:99px;transition:width .3s}
.daygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin-top:.5rem}
@media(max-width:760px){.daygrid{grid-template-columns:1fr 1fr}}
.dcard{
  background:var(--tint);border:1px solid var(--line);border-radius:11px;padding:.7rem .8rem;
  text-align:start;font:inherit;color:var(--txt);cursor:pointer
}
.dcard:hover{border-color:var(--sky)}
.dcard .dn{font-size:.72rem;font-weight:700;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase}
.dcard p{font-size:.8rem;margin:.2rem 0 .45rem;color:var(--soft);min-height:2.4em;line-height:1.35}
.dcard em{font-size:.75rem;color:var(--muted);font-style:normal;display:block;margin-top:.3rem}
.daytabs{display:flex;gap:.3rem;margin-bottom:.7rem;flex-wrap:wrap}
.dt{
  border:1px solid var(--line);background:#fff;border-radius:99px;padding:.34rem .85rem;
  font:inherit;font-size:.82rem;font-weight:700;color:var(--soft);cursor:pointer
}
.dt:hover{border-color:var(--sky)}
.dt.on{background:var(--ink);border-color:var(--ink);color:#fff}
.daybar{
  background:var(--tint2);border-radius:9px;padding:.45rem .8rem;font-size:.82rem;
  font-weight:700;color:var(--ink2);margin-bottom:.9rem
}
.acthead .ahmid{flex:1;min-width:0}
.chk{display:flex;align-items:center;gap:.35rem;font-size:.78rem;color:var(--muted);cursor:pointer;flex:none}
.chk input{width:16px;height:16px;accent-color:var(--green);cursor:pointer}
.act.done{border-color:#B7DFCC;background:#FAFEFC}
.act.done .acthead .n{background:var(--green)}
.blk.scen{background:var(--tint);border-radius:11px;padding:.75rem .9rem;border-top:0}
.blk.scen h4{color:var(--ink2)}
.search{
  width:100%;font:inherit;font-size:.9rem;border:1px solid var(--line);border-radius:10px;
  padding:.5rem .8rem;background:#fff;outline:none
}
.search:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(113,192,228,.18)}
.note .ad{background:var(--tint);border-radius:8px;padding:.5rem .7rem;font-size:.85rem}
.herostat{font-size:.8rem;color:var(--sky);font-weight:700;letter-spacing:.05em;margin-top:1.2rem}
@media print{.tiles,.daytabs,.chk,.search,.dcard{display:none!important}}

/* ---------- v3: logo, ship, simulator, refs ---------- */









.refbar{
  display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;
  background:var(--tint);border:1px solid var(--line);border-radius:9px;
  padding:.4rem .6rem;margin:.55rem 0 .2rem;font-size:.78rem
}
.refbar .rl{font-weight:700;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase;font-size:.68rem}
.refbar .rf{background:#fff;border:1px solid var(--line);border-radius:6px;padding:.14rem .45rem;color:var(--soft)}
.refbar .rf b{color:var(--ink)}

.shipcard{padding:.6rem}
.shipsvg{width:100%;height:auto;display:block}
.shipsvg .blk rect{transition:fill .35s ease}
.zones{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}
@media(max-width:760px){.zones{grid-template-columns:1fr 1fr}}
.zone{
  display:block;text-align:start;background:#fff;border:1px solid var(--line);
  border-radius:11px;padding:.6rem .7rem;font:inherit;color:var(--txt);cursor:pointer
}
.zone:hover{border-color:var(--sky)}
.zone .sw{display:inline-block;width:14px;height:14px;border-radius:4px;margin-bottom:.3rem}
.zone b{display:block;font-size:.86rem}
.zone em{font-style:normal;font-size:.74rem;color:var(--muted);display:block;margin-bottom:.35rem}

.simgrid{display:flex;flex-direction:column;gap:.1rem}
.simrow{
  display:grid;grid-template-columns:1.6fr .7fr auto .7fr .7fr;gap:.5rem;align-items:center;
  padding:.55rem .2rem;border-bottom:1px dashed var(--tint2)
}
.simrow:last-child{border:0}
.sk{font-size:.86rem;font-weight:600}
.sb{font-size:1rem;color:var(--muted);text-align:end}
.ar{color:var(--line);text-align:center}
.sa{font-size:1.22rem;font-weight:700;text-align:end;letter-spacing:-.025em}
.sd{font-size:.8rem;font-weight:700;text-align:end}
.sa.good,.sd.good{color:var(--green)}
.sa.bad,.sd.bad{color:var(--orange)}
.levers{display:flex;flex-wrap:wrap;gap:.35rem}
th .colh{
  width:100%;min-width:80px;border:0;background:transparent;font:inherit;font-size:.78rem;
  font-weight:700;color:#fff;outline:none
}
th .colh:focus{background:rgba(255,255,255,.15);border-radius:4px}
@media print{.refbar{background:#fff}.zone,.levers{display:none!important}}

/* ---------- v4: programme workflow ---------- */
.phasehead{display:flex;align-items:baseline;gap:.6rem;margin:1.3rem 0 .5rem;
  padding-bottom:.35rem;border-bottom:2px solid var(--ink)}
.phasehead b{font-size:.95rem;letter-spacing:-.01em}
.phasehead em{font-style:normal;font-size:.78rem;color:var(--muted);margin-inline-start:auto}
.card.stage{padding:.85rem .95rem}
.stage.done{border-color:#B7DFCC;background:#FAFEFC}
.stage.released{border-color:#F2D0A8}
.sthead{display:flex;gap:.6rem;align-items:flex-start}
.sid{background:var(--ink);color:#fff;border-radius:7px;padding:.16rem .45rem;font-size:.74rem;font-weight:700;flex:none}
.stmid{flex:1;min-width:0}
.stmid h3{margin:0;font-size:.97rem}
.stat{font-size:.7rem;font-weight:700;padding:.16rem .5rem;border-radius:99px;flex:none;
  background:var(--tint2);color:var(--soft)}
.stat.done{background:#EAF6F0;color:var(--green)}
.stat.released{background:var(--sand);color:var(--orange)}
.stat.raised{background:var(--tint2);color:var(--ink2)}
.dept{font-weight:700;color:var(--dc)}
.gatebox{margin:.6rem 0 .3rem;background:var(--tint);border-radius:9px;padding:.5rem .65rem}
.gatebox h4{font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 .35rem}
.gline{display:flex;align-items:center;gap:.45rem;padding:.22rem 0;font-size:.83rem;cursor:pointer}
.gline input{width:15px;height:15px;accent-color:var(--green);flex:none}
.gline .gt{flex:1}
.gline.ok .gt{color:var(--green)}
.gline .gd{font-size:.7rem;font-weight:700;color:var(--dc);flex:none}
.daysbar{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:.55rem 0 .3rem}
.daysbar span{display:grid;place-items:center;font-size:.7rem;font-weight:700;color:#fff;min-width:22px}
.dv{background:var(--green)}.dw{background:var(--orange)}.dr{background:var(--red)}
.dayleg{display:flex;flex-wrap:wrap;gap:.7rem;font-size:.74rem;color:var(--muted);align-items:center}
.dayleg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:.25rem}
.lv{background:var(--green)}.lw{background:var(--orange)}.lr{background:var(--red)}
.dayleg b{color:var(--ink)}
.dayleg em{font-style:normal;font-weight:700}
.warn{background:var(--sand);border-inline-start:3px solid var(--orange);border-radius:0 8px 8px 0;
  padding:.45rem .65rem;font-size:.82rem;margin:.4rem 0}
.btn.warnbtn{border-color:var(--orange);color:var(--orange)}
.chart{display:flex;flex-direction:column;gap:.3rem;margin:.4rem 0}
.crow{display:grid;grid-template-columns:minmax(120px,1.3fr) 3fr auto;gap:.6rem;align-items:center}
.cl{font-size:.83rem}
.ct{height:14px;background:var(--tint2);border-radius:4px;overflow:hidden}
.ct i{display:block;height:100%;border-radius:4px;transition:width .35s}
.crow b{font-size:.82rem;min-width:3ch;text-align:end}
.gaps{list-style:none;padding:0;margin:.4rem 0}
.gaps li{padding:.45rem 0;border-bottom:1px dashed var(--tint2);font-size:.86rem}
.gaps li:last-child{border:0}
.gaps b{display:inline-block;margin-inline-end:.5rem}
.gaps em{font-style:normal;font-size:.74rem;background:var(--tint2);border-radius:99px;padding:.1rem .45rem;color:var(--soft)}
.gaps span{display:block;font-size:.78rem;color:var(--orange);margin-top:.2rem}
.ok{color:var(--green);font-weight:700}
@media print{.gatebox input,.warnbtn{display:none}}

/* ---------- v5: ERP components ---------- */
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.8rem}
.mono.sm{font-size:.74rem;color:var(--muted)}
tr.urg td{background:#FEF7EF}
.urgtag{display:inline-block;font-style:normal;font-size:.68rem;font-weight:600;color:var(--orange);
  background:var(--sand);border-radius:99px;padding:.02rem .45rem;margin-inline-start:.35rem}
.calcout{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.6rem;margin-top:1rem}
.co{background:var(--tint);border-radius:10px;padding:.7rem .8rem;text-align:center}
.co span{display:block;font-size:.72rem;color:var(--muted);font-weight:600}
.co b{display:block;font-size:1.25rem;letter-spacing:-.02em;margin-top:.15rem}
.co.big{background:var(--ink);color:#fff}
.co.big span{color:#9FC6D8}
.co.big b{font-size:1.7rem}
.card.tool h3{font-size:.98rem;margin-bottom:.1rem}
.tile{background:var(--card)}
.dt{font-weight:600}
.nav-item .nb{line-height:1.5}
@media print{.side,.topbar,.foot{display:none!important}.mainwrap{display:block}main{max-width:none;padding:0}}

/* ---------- v6: drills, sequence, publish, computed cells ---------- */
.seqcard .seq{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.45rem;margin:.5rem 0 .8rem}
.sq{display:flex;align-items:center;gap:.5rem;background:var(--tint);border:1px solid var(--line);
  border-radius:9px;padding:.5rem .6rem;font:inherit;text-align:start;cursor:pointer;color:var(--soft)}
.sq:hover{border-color:var(--sky)}
.sq .sn{width:21px;height:21px;flex:none;border-radius:50%;background:#fff;border:1px solid var(--line2);
  display:grid;place-items:center;font-size:.72rem;font-weight:600}
.sq em{font-style:normal;font-size:.79rem;line-height:1.3}
.sq.ok{background:#EDF9F3;border-color:#B7DFCC;color:var(--green)}
.sq.ok .sn{background:var(--green);color:#fff;border-color:var(--green)}
.sq.now{background:var(--ink);border-color:var(--ink);color:#fff}
.sq.now .sn{background:var(--sky);color:#08222D;border-color:var(--sky)}
.nextbox{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;background:var(--sand);
  border-radius:10px;padding:.6rem .8rem}
.nextbox span{font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--orange)}
.nextbox b{flex:1;font-size:.9rem}
.nextbox.ok{background:#EDF9F3}
.dt .tick{font-style:normal;color:var(--green);margin-inline-start:.25rem;font-size:.76rem}
.dt.on .tick{color:#08222D}
.scorebar{display:flex;align-items:center;gap:.7rem;margin-top:.7rem}
.scorebar span{font-size:.74rem;color:var(--muted);font-weight:600}
.scorebar b{font-size:1.1rem}
.scorebar b.good{color:var(--green)} .scorebar b.bad{color:var(--orange)}
.scorebar .tb{flex:1}
.drillq{padding:.85rem .95rem}
.drillq.right{border-color:#B7DFCC;background:#FAFEFC}
.drillq.wrong{border-color:#F2C9C2;background:#FEFAF9}
.qtext{font-size:.92rem;margin-bottom:.5rem}
.opts{display:flex;flex-wrap:wrap;gap:.35rem}
.opt{border:1px solid var(--line);background:#fff;border-radius:8px;padding:.34rem .7rem;
  font:inherit;font-size:.82rem;cursor:pointer;color:var(--soft)}
.opt:hover{border-color:var(--sky)}
.opt.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.opt.ans{background:var(--green);border-color:var(--green);color:#fff}
.opt.bad{background:var(--red);border-color:var(--red);color:#fff}
.whybox{margin-top:.55rem;background:var(--tint);border-radius:8px;padding:.5rem .7rem;font-size:.85rem}
.whybox b{color:var(--ink)}
td.calc input{background:var(--tint2);font-weight:600;color:var(--ink2)}
.totbox{display:flex;flex-wrap:wrap;align-items:baseline;gap:.35rem .8rem;background:var(--tint);
  border-radius:9px;padding:.55rem .75rem;margin:.5rem 0 .2rem;font-size:.8rem}
.totbox span{font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:100%}
.totbox b{font-size:1.02rem}
.totbox b.good{color:var(--green)}
.totbox em{font-style:normal;color:var(--muted);margin-inline-end:.5rem}
ol.steps{padding-inline-start:1.3rem}
ol.steps li{margin:.5rem 0;font-size:.9rem}
</style>
</head>

/* ------------------------------------------------------------- simulator ---
   Before/after model. Baseline is derived from the assessment: the weaker the
   organisation, the worse the starting figures. Each countermeasure the user
   has completed moves specific metrics by a bounded amount.
------------------------------------------------------------------------- */
const LEVERS = [
  { id:"gate",  acts:[7,8,20],    en:"Readiness gate before release", ar:"بوابة الجاهزية قبل الإطلاق",
    ready:+34, wait:-22, stop:-55, rework:-45 },
  { id:"flow",  acts:[6,16,17],   en:"Flow and line balance",          ar:"التدفق وموازنة الخط",
    ready:+4,  wait:-18, stop:-12, rework:-8 },
  { id:"pull",  acts:[18,19],     en:"Pull replenishment",             ar:"التزويد بالسحب",
    ready:+3,  wait:-11, stop:-14, rework:-4 },
  { id:"std",   acts:[13,14,23],  en:"Standard work and error-proofing",ar:"العمل القياسي ومنع الخطأ",
    ready:+5,  wait:-6,  stop:-10, rework:-34 },
  { id:"vis",   acts:[11,12,28],  en:"Visual management and daily routine", ar:"الإدارة البصرية والجولة اليومية",
    ready:+6,  wait:-8,  stop:-18, rework:-9 },
  { id:"smed",  acts:[21,22],     en:"Changeover reduction",           ar:"تقليل زمن التحويل",
    ready:+2,  wait:-9,  stop:-6,  rework:-3 },
  { id:"kaizen",acts:[25,26,27],  en:"Root-cause problem solving",     ar:"حل المشكلات جذرياً",
    ready:+4,  wait:-5,  stop:-9,  rework:-22 }

function simulate(doneSet, maturity){
  /* baseline scales with maturity: 1.0 → poor, 5.0 → strong */
  const m = maturity === null ? 2.5 : maturity;
  const k = (5 - m) / 4;                       /* 0 = excellent, 1 = worst */
  const base = {
    lead:   Math.round((28 + 62 * k) * 10) / 10,
    ready:  Math.round(88 - 52 * k),
    stop:   Math.round(2 + 11 * k),
    rework: Math.round(2 + 9 * k),
    ratio:  Math.round((34 - 22 * k) * 10) / 10
  };
  const applied = LEVERS.filter(l => l.acts.some(n => doneSet.has(n)));
  let readyGain = 0, waitCut = 0, stopCut = 0, reworkCut = 0;
  applied.forEach(l => {
    const frac = l.acts.filter(n => doneSet.has(n)).length / l.acts.length;
    readyGain += l.ready * frac;
    waitCut   += -l.wait * frac;
    stopCut   += -l.stop * frac;
    reworkCut += -l.rework * frac;
  });
  const cap = (v, mx) => Math.min(v, mx);
  waitCut   = cap(waitCut, 62);
  stopCut   = cap(stopCut, 82);
  reworkCut = cap(reworkCut, 88);
  const after = {
    lead:   Math.round(base.lead * (1 - waitCut / 100) * 10) / 10,
    ready:  Math.min(97, Math.round(base.ready + readyGain)),
    stop:   Math.max(0, Math.round(base.stop * (1 - stopCut / 100))),
    rework: Math.max(0, Math.round(base.rework * (1 - reworkCut / 100))),
    ratio:  Math.round(Math.min(62, base.ratio / (1 - waitCut / 100)) * 10) / 10
  };
  return { base, after, applied, coverage: applied.length / LEVERS.length };
}

/* ---------------------------------------------------------------- zip ----
   Store-only ZIP writer. Enough to emit valid .docx and .pptx packages
   with no external library and no network.
------------------------------------------------------------------------- */
const CRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0; }
  return t;
})();
function crc32(buf){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  files.forEach(f => {
    const name = enc.encode(f.name);
    const data = typeof f.data === "string" ? enc.encode(f.data) : f.data;
    const crc = crc32(data);
    const lh = new Uint8Array(30 + name.length);
    const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0, true);
    dv.setUint16(8, 0, true); dv.setUint16(10, 0, true); dv.setUint16(12, 0, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, data.length, true); dv.setUint32(22, data.length, true);
    dv.setUint16(26, name.length, true); dv.setUint16(28, 0, true);
    lh.set(name, 30);
    parts.push(lh, data);
    const ch = new Uint8Array(46 + name.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true); cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true);
    cv.setUint16(28, name.length, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    ch.set(name, 46);
    central.push(ch);
    offset += lh.length + data.length;
  });
  const cdSize = central.reduce((a, b) => a + b.length, 0);
  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true); ev.setUint16(20, 0, true);
  const all = parts.concat(central, [end]);
  const total = all.reduce((a, b) => a + b.length, 0);
  const out = new Uint8Array(total);
  let p = 0; all.forEach(b => { out.set(b, p); p += b.length; });
  return out;
}
function download(bytes, name, mime){
  const blob = new Blob([bytes], { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
const xe = s => String(s == null ? "" : s)

    else if (sec.t === "tbl") TBL(sec.rows, sec.rows[0].map(() => Math.floor(9360 / sec.rows[0].length)));

          + `<w:color w:val="${i.c||"71C0E4"}"/></w:rPr><w:t xml:space="preserve">${bar}</w:t></w:r></w:p></w:tc>`
          + `<w:tc><w:tcPr><w:tcW w:w="${VW}" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>`

      B.push(`<w:tbl><w:tblPr><w:tblW w:w="9360" w:type="dxa"/>${rtl?"<w:bidiVisual/>":""}`

function stStatus(id){ return (S.prog && S.prog[id] && S.prog[id].st) || ""; }
function stRec(id){
  if(!S.prog) S.prog={};
  if(!S.prog[id]) S.prog[id]={ st:"", ok:{}, early:false, note:"" };
  return S.prog[id];
}
function gateGranted(stage){
  const r=stRec(stage.id);
  return stage.gate.filter((g,i)=>r.ok[i]).length;
}
function gateReady(stage){ return gateGranted(stage)===stage.gate.length; }

/* which Lean levers the participant has actually earned, from completed activities */
function activeLevers(){
  const ds=doneSet(), out={};
  LEVERS.forEach(l=>{
    const f=l.acts.filter(n=>ds.has(n)).length/l.acts.length;
    if(f>0) out[l.id]=f;
  });
  return out;
}

/* Days actually consumed by a stage, and where they went. */
function stageResult(stage){
  const r=stRec(stage.id), lev=activeLevers();
  let cut=0;
  (stage.levers||[]).forEach(id=>{ if(lev[id]) cut+=lev[id]*0.34; });
  cut=Math.min(cut,0.72);
  let wait=stage.wait*(1-cut);
  let rework=0;
  if(r.early){
    const missing=stage.gate.length-gateGranted(stage);
    rework=Math.round(stage.vad*0.18*missing*10)/10;   /* started unready → rework */
    wait+=stage.wait*0.30*missing;                      /* and it stalls partway  */
  }
  wait=Math.round(wait*10)/10; rework=Math.round(rework*10)/10;
  return { vad:stage.vad, wait, rework, total:Math.round((stage.vad+wait+rework)*10)/10,
           saved:Math.round((stage.wait-wait)*10)/10, early:r.early, missing:stage.gate.length-gateGranted(stage) };
}

function programme(){
  const rows=STAGES.map(s=>({ s, r:stageResult(s), st:stStatus(s.id) }));
  const done=rows.filter(x=>x.st==="done");
  const planTotal=STAGES.reduce((a,s)=>a+s.vad+s.wait,0);
  const actual=done.reduce((a,x)=>a+x.r.total,0);
  const vad=done.reduce((a,x)=>a+x.r.vad,0);
  const wait=done.reduce((a,x)=>a+x.r.wait,0);
  const rework=done.reduce((a,x)=>a+x.r.rework,0);
  const baseline=done.reduce((a,x)=>a+x.s.vad+x.s.wait,0);
  const earlies=done.filter(x=>x.r.early);
  return { rows, done:done.length, total:STAGES.length,
    planTotal:Math.round(planTotal*10)/10, actual:Math.round(actual*10)/10,
    baseline:Math.round(baseline*10)/10,
    vad:Math.round(vad*10)/10, wait:Math.round(wait*10)/10, rework:Math.round(rework*10)/10,
    ratio: actual? Math.round(vad/actual*1000)/10 : 0,
    saved: Math.round((baseline-actual)*10)/10,
    earlies, gaps: rows.filter(x=>x.st!=="done") };
}

/* ------------------------------------------------------- auto-run engine --
   Runs the whole programme the way a disciplined team would: raise, obtain
   every approval, then release. Optionally the "as-is" way: release on the
   date whatever the gate says.
------------------------------------------------------------------------- */
function autoRun(lean){
  STAGES.forEach(s=>{
    const r=stRec(s.id);
    r.ok={}; r.early=false;
    if(lean){ s.gate.forEach((g,i)=>{ r.ok[i]=true; }); }
    else {
      /* as-is: whatever is convenient is signed, the rest is waved through */
      s.gate.forEach((g,i)=>{ r.ok[i]= (i%2===0); });
      r.early = !gateReady(s);
    }
    r.st="done";
  });
}

/* --------------------------------------------------------------- inbox ---
   Every outstanding approval on a raised stage becomes a task, addressed to
   the department that owns that signature.
------------------------------------------------------------------------- */
function inbox(all){
  const out=[];
  STAGES.forEach(st=>{
    const sts=stStatus(st.id);
    if(sts!=="raised" && sts!=="released") return;
    const r=stRec(st.id);
    st.gate.forEach((g,i)=>{
      if(r.ok[i]) return;
      if(!all && !mayApprove(g.d)) return;
      out.push({ stage:st, gi:i, gate:g, dept:g.d, urgent:(sts==="released") });
    });
  });
  return out;
}

/* ---------------------------------------------------------- calculators --- */
const CALCS = [
  { k:"takt", en:"Takt time", ar:"زمن التاكت",
    f:[{k:"avail",en:"Available minutes per period",ar:"الدقائق المتاحة في الفترة",d:27000},
       {k:"dem",  en:"Demand in the period (units)", ar:"الطلب في الفترة (وحدات)", d:15}],
    run:v=>{ const t=v.dem?v.avail/v.dem:0;
      return [{en:"Takt time",ar:"زمن التاكت",v:Math.round(t)+" min/unit"},
              {en:"Takt in hours",ar:"التاكت بالساعات",v:(t/60).toFixed(1)+" h"}]; } },
  { k:"oee", en:"OEE", ar:"الكفاءة الكلية للمعدات",
    f:[{k:"plan",en:"Planned production time (min)",ar:"زمن الإنتاج المخطط (دقيقة)",d:480},
       {k:"down",en:"Downtime (min)",ar:"زمن التوقف (دقيقة)",d:60},
       {k:"ideal",en:"Ideal cycle time (min/unit)",ar:"زمن الدورة المثالي (دقيقة/وحدة)",d:2},
       {k:"out", en:"Total units produced",ar:"إجمالي الوحدات المنتجة",d:180},
       {k:"good",en:"Good units",ar:"الوحدات السليمة",d:170}],
    run:v=>{ const run=Math.max(0,v.plan-v.down);
      const a=v.plan?run/v.plan:0, p=run?(v.ideal*v.out)/run:0, q=v.out?v.good/v.out:0;
      const o=a*p*q;
      return [{en:"Availability",ar:"الجاهزية",v:(a*100).toFixed(1)+"%"},
              {en:"Performance",ar:"الأداء",v:(p*100).toFixed(1)+"%"},
              {en:"Quality",ar:"الجودة",v:(q*100).toFixed(1)+"%"},
              {en:"OEE",ar:"الكفاءة الكلية",v:(o*100).toFixed(1)+"%",big:true}]; } },
  { k:"kanban", en:"Kanban sizing", ar:"حجم كانبان",
    f:[{k:"use", en:"Daily consumption",ar:"الاستهلاك اليومي",d:40},
       {k:"lt",  en:"Replenishment lead time (days)",ar:"زمن التزويد (أيام)",d:3},
       {k:"saf", en:"Safety (days)",ar:"الأمان (أيام)",d:1},
       {k:"cont",en:"Units per container",ar:"وحدات لكل حاوية",d:80}],
    run:v=>{ const rop=v.use*(v.lt+v.saf), cards=v.cont?Math.ceil(rop/v.cont):0;
      return [{en:"Trigger point",ar:"نقطة الإطلاق",v:Math.round(rop)+" units"},
              {en:"Cards in circulation",ar:"البطاقات المتداولة",v:String(cards),big:true},
              {en:"Buffer cover",ar:"تغطية المخزون",v:(v.lt+v.saf)+" days"}]; } },
  { k:"balance", en:"Line balance", ar:"موازنة الخط",
    f:[{k:"work",en:"Total work content (min)",ar:"إجمالي محتوى العمل (دقيقة)",d:6710},
       {k:"takt",en:"Takt time (min)",ar:"زمن التاكت (دقيقة)",d:1800},
       {k:"st",  en:"Stations today",ar:"المحطات حالياً",d:4}],
    run:v=>{ const min=v.takt?Math.ceil(v.work/v.takt):0;
      const eff=(v.st&&v.takt)?v.work/(v.st*v.takt):0;
      return [{en:"Minimum stations",ar:"الحد الأدنى للمحطات",v:String(min)},
              {en:"Balance efficiency",ar:"كفاءة الموازنة",v:(eff*100).toFixed(1)+"%",big:true},
              {en:"Idle time",ar:"الزمن العاطل",v:Math.max(0,Math.round(v.st*v.takt-v.work))+" min"}]; } },
  { k:"little", en:"Lead time (Little's law)", ar:"الزمن الكلي (قانون ليتل)",
    f:[{k:"wip",en:"Work in progress (items)",ar:"العمل تحت التشغيل (أصناف)",d:14},
       {k:"thr",en:"Throughput (items per day)",ar:"الإنتاجية (أصناف يومياً)",d:0.8}],
    run:v=>{ const lt=v.thr?v.wip/v.thr:0;
      return [{en:"Lead time",ar:"الزمن الكلي",v:lt.toFixed(1)+" days",big:true},
              {en:"Halve the WIP",ar:"عند تنصيف العمل تحت التشغيل",v:(lt/2).toFixed(1)+" days"}]; } },
  { k:"smed", en:"Changeover (SMED)", ar:"التحويل (SMED)",
    f:[{k:"int",en:"Internal minutes (machine stopped)",ar:"الدقائق الداخلية (المعدة متوقفة)",d:71},
       {k:"ext",en:"External minutes",ar:"الدقائق الخارجية",d:25},
       {k:"conv",en:"Internal minutes convertible to external",ar:"دقائق داخلية قابلة للتحويل",d:34},
       {k:"simp",en:"Minutes saved by simplifying",ar:"دقائق موفَّرة بالتبسيط",d:12}],
    run:v=>{ const before=v.int;
      const after=Math.max(0,v.int-v.conv-v.simp);
      const cut=before?((before-after)/before*100):0;
      return [{en:"Stopped time before",ar:"زمن التوقف قبل",v:before+" min"},
              {en:"Stopped time after",ar:"زمن التوقف بعد",v:after+" min",big:true},
              {en:"Reduction",ar:"نسبة التقليص",v:cut.toFixed(0)+"%"}]; } }
];
function calcRun(c){
  const v={}; c.f.forEach(f=>{ const raw=(S.calc&&S.calc[c.k]&&S.calc[c.k][f.k]); v[f.k]=(raw===undefined||raw==="")?f.d:parseFloat(raw)||0; });
  return { v, out:c.run(v) };
}

function drillState(k){ if(!S.drill) S.drill={}; if(!S.drill[k]) S.drill[k]={a:{},shown:false}; return S.drill[k]; }
function drillScore(d){
  const st=drillState(d.k); let ok=0,ans=0;
  d.q.forEach((q,i)=>{ const v=st.a[i]; if(v!==undefined){ ans++; if(v===q.a) ok++; } });
  return { ok, ans, total:d.q.length, pct: d.q.length?Math.round(ok/d.q.length*100):0 };
}
function drillsDone(){ return DRILLS.filter(d=>drillScore(d).ans===d.q.length).length; }

/* --------------------------------------------------- computed template fields
   Rules that recompute derived cells whenever the participant types.
   Each rule receives the row array and the whole grid.
------------------------------------------------------------------------- */
const TCOMPUTE = {
  T2:  { cells:[5], calc:(r)=>{ const f=parseFloat(r[3]),i=parseFloat(r[4]);
          return { 5:(isFinite(f)&&isFinite(i))?String(f*i):"" }; } },
  T5:  { total:true, calc:null },
  T16: { cells:[1], grid:(g)=>{ const a=parseFloat((g[0]||[])[1]), d=parseFloat((g[1]||[])[1]);
          if(isFinite(a)&&isFinite(d)&&d) { if(!g[2]) g[2]=["","",""]; g[2][1]=String(Math.round(a/d)); } } },
  T17: { cells:[3], calc:(r)=>{ const now=parseFloat(r[1]),mv=parseFloat(r[4]);
          return isFinite(now)&&isFinite(mv)?{3:String(now+mv)}:{}; } },
  T29: { cells:[4], calc:(r)=>{ const a=parseFloat(r[2]),b=parseFloat(r[3]);
          if(!isFinite(a)||!isFinite(b)||!a) return {4:""};
          const p=Math.round((b-a)/a*100); return {4:(p>0?"+":"")+p+"%"}; } }
};
function tRecompute(id){
  const rule=TCOMPUTE[id]; if(!rule) return;
  const tp=TMPLS.find(x=>x.id===id); const g=S.tmplData["t_"+tp.id]; if(!g) return;
  if(rule.grid) rule.grid(g);
  if(rule.calc) g.forEach(r=>{ const out=rule.calc(r)||{}; Object.keys(out).forEach(k=>{ r[+k]=out[k]; }); });
}
function tTotals(id){
  if(id!=="T5") return null;
  const g=S.tmplData["t_T5"]||[];
  let cyc=0,wait=0,n=0;
  g.forEach(r=>{ const c=parseFloat(r[1]), w=parseFloat(r[4]);
    if(isFinite(c)){cyc+=c;n++;} if(isFinite(w)) wait+=w; });
  if(!n) return null;
  const lead=cyc+wait;
  return { cyc:Math.round(cyc*10)/10, wait:Math.round(wait*10)/10,
           lead:Math.round(lead*10)/10, ratio: lead?Math.round(cyc/lead*1000)/10:0 };
}

function steps(){

      ok:!!S.plan, go:"plan" },
    { k:"out", en:"Issue your report", ar:"أصدر تقريرك",
      ok:!!S.issued, go:"out" }

}
